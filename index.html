<script>
(() => {
'use strict';

// ============================================================
//  CANVAS
// ============================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(480, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

// ============================================================
//  UTIL
// ============================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const norm = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

function rr(x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r === undefined ? 3 : r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

// ============================================================
//  AUDIO
// ============================================================
let AC = null, master = null, muted = false;

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.35;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}

function tone(freq, dur, type, vol, slideTo, delay) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noiseBurst(dur, vol, cutoff) {
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
  const src = AC.createBufferSource();
  src.buffer = buf;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff || 1400;
  const g = AC.createGain();
  g.gain.value = vol || 0.25;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
}

const sound = {
  shot(power) {
    tone(160 + power * 120, 0.06, 'square', 0.05, 60);
    noiseBurst(0.07, 0.10, 2600);
  },
  melee() { noiseBurst(0.09, 0.12, 1800); tone(700, 0.07, 'triangle', 0.05, 300); },
  whiff() { noiseBurst(0.11, 0.06, 3200); },
  groan() { tone(rand(70, 100), 0.45, 'sawtooth', 0.05, 48); noiseBurst(0.35, 0.05, 380); },
  bite() { noiseBurst(0.13, 0.16, 1100); tone(150, 0.13, 'square', 0.09, 55); },
  spit() { noiseBurst(0.18, 0.10, 1800); tone(300, 0.16, 'sawtooth', 0.06, 700); },
  door() { noiseBurst(0.55, 0.24, 600); tone(62, 0.8, 'sine', 0.18, 28); },
  thud() { tone(120, 0.16, 'square', 0.09, 60); noiseBurst(0.10, 0.06, 500); },
  hatch() { noiseBurst(0.35, 0.18, 900); tone(90, 0.5, 'square', 0.10, 40); },
  hit() { tone(1200, 0.03, 'square', 0.05, 800); },
  kill() { tone(660, 0.08, 'triangle', 0.09); tone(990, 0.10, 'triangle', 0.08, null, 0.06); },
  hurt() { tone(180, 0.18, 'sawtooth', 0.12, 70); noiseBurst(0.12, 0.10, 700); },
  jump() { tone(380, 0.10, 'sine', 0.06, 640); },
  slide() { noiseBurst(0.30, 0.10, 900); tone(240, 0.25, 'sine', 0.05, 90); },
  reload() { tone(240, 0.05, 'square', 0.05); tone(320, 0.05, 'square', 0.05, null, 0.12); },
  boom() { noiseBurst(0.5, 0.35, 700); tone(80, 0.45, 'sine', 0.22, 35); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, null, i * 0.1)); },
  lose() { [420, 330, 240].forEach((f, i) => tone(f, 0.35, 'sine', 0.11, null, i * 0.14)); },
  reroll() { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.10, 'square', 0.05, null, i * 0.05)); }
};

// ============================================================
//  HORROR AMBIENCE — drone, wind, creaks, heartbeat
// ============================================================
let amb = null;
let ambT = 0;
let heartT = 0;
let motifT = 0;

function startAmbience() {
  if (!AC || amb) return;
  try {
    const out = AC.createGain();
    out.gain.value = 0;
    out.connect(master);

    // low drone, slightly detuned for unease
    const oscs = [];
    const spec = [[41.2, 0.055], [55, 0.05], [82.4, 0.016]];
    for (let i = 0; i < spec.length; i++) {
      const o = AC.createOscillator();
      o.type = i === 2 ? 'triangle' : 'sine';
      o.frequency.value = spec[i][0] * (i === 1 ? 1.007 : 1);
      const g = AC.createGain();
      g.gain.value = spec[i][1];
      o.connect(g);
      g.connect(out);
      o.start();
      oscs.push(o);
    }

    // wind bed: looping brown-ish noise through a bandpass
    const n = Math.floor(AC.sampleRate * 4);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      d[i] = last * 3.2;
    }
    const src = AC.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 300;
    bp.Q.value = 0.7;
    const wg = AC.createGain();
    wg.gain.value = 0.09;
    src.connect(bp);
    bp.connect(wg);
    wg.connect(out);
    src.start();

    // slow swell on the wind
    const lfo = AC.createOscillator();
    lfo.frequency.value = 0.045;
    const lfoGain = AC.createGain();
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    lfo.start();

    out.gain.setTargetAtTime(0.5, AC.currentTime, 3);
    amb = { out, oscs, src, lfo };
    ambT = 5;
    motifT = 12;
  } catch (e) {
    amb = null;
  }
}

function stopAmbience() {
  if (!amb) return;
  const a = amb;
  amb = null;
  try {
    a.out.gain.setTargetAtTime(0, AC.currentTime, 0.5);
    setTimeout(() => {
      try { a.src.stop(); a.lfo.stop(); for (const o of a.oscs) o.stop(); } catch (e) {}
    }, 900);
  } catch (e) {}
}

function creak() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(rand(70, 110), t0);
  o.frequency.exponentialRampToValueAtTime(rand(26, 40), t0 + 1.7);
  const f = AC.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = rand(320, 720);
  f.Q.value = 7;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(rand(0.02, 0.05), t0 + 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 2);
}

function distantGroan() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(rand(48, 66), t0);
  const vib = AC.createOscillator();
  vib.frequency.value = rand(4, 7);
  const vibGain = AC.createGain();
  vibGain.gain.value = 4;
  vib.connect(vibGain); vibGain.connect(o.frequency);
  const f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 420;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(rand(0.02, 0.045), t0 + 0.8);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 3.3);
  vib.start(t0); vib.stop(t0 + 3.3);
}

function heartbeat() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  for (const [dt, vol] of [[0, 0.18], [0.22, 0.11]]) {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(62, t0 + dt);
    o.frequency.exponentialRampToValueAtTime(38, t0 + dt + 0.16);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.2);
    o.connect(g); g.connect(master);
    o.start(t0 + dt); o.stop(t0 + dt + 0.22);
  }
}

// slow, sparse minor motif — the "music"
function motif() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const notes = [110, 130.8, 164.8, 98];
  const root = notes[Math.floor(Math.random() * notes.length)];
  const freqs = [root, root * 1.1892, root * 1.4983];   // minor-ish interval stack
  for (let i = 0; i < freqs.length; i++) {
    const o = AC.createOscillator();
    o.type = 'triangle';
    o.frequency.value = freqs[i];
    const g = AC.createGain();
    const start = t0 + i * 0.45;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.022, start + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 5.5);
    o.connect(g); g.connect(master);
    o.start(start); o.stop(start + 5.6);
  }
}

function updateAmbience(dt) {
  if (!AC || muted || !amb) return;

  ambT -= dt;
  if (ambT <= 0) {
    ambT = rand(6, 16);
    const r = Math.random();
    if (r < 0.45) creak();
    else if (r < 0.85) distantGroan();
    else {
      // a rare, deliberately wrong sound
      tone(rand(120, 160), 0.9, 'sawtooth', 0.03, rand(60, 90));
    }
  }

  motifT -= dt;
  if (motifT <= 0) {
    motifT = rand(18, 34);
    motif();
  }

  if (state === 'play' && PLAYER.alive && PLAYER.hp / Math.max(1, PLAYER.maxHp) < 0.35) {
    heartT -= dt;
    if (heartT <= 0) {
      heartT = 0.85;
      heartbeat();
    }
  } else {
    heartT = 0;
  }
}

// Deterministic layout generators — each arena has its own topology.
function genRooms() {
  // 16 rooms in a 4x4 grid, doors punched between neighbours
  const W = 24, H = 24;
  const xs = [1, 7, 13, 19], ws = [5, 5, 5, 4];
  const ys = [1, 7, 13, 19], hs = [5, 5, 5, 4];
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  for (let ry = 0; ry < 4; ry++) {
    for (let rx = 0; rx < 4; rx++) {
      for (let y = 0; y < hs[ry]; y++) {
        for (let x = 0; x < ws[rx]; x++) g[ys[ry] + y][xs[rx] + x] = '.';
      }
    }
  }
  for (let ry = 0; ry < 3; ry++) {
    const wallRow = ys[ry] + hs[ry];
    for (let rx = 0; rx < 4; rx++) g[wallRow][xs[rx] + Math.floor(ws[rx] / 2)] = 'D';
  }
  for (let rx = 0; rx < 3; rx++) {
    const wallCol = xs[rx] + ws[rx];
    for (let ry = 0; ry < 4; ry++) g[ys[ry] + Math.floor(hs[ry] / 2)][wallCol] = 'D';
  }
  return g.map(r => r.join(''));
}

function genHall() {
  // one long avenue with side chambers
  const W = 24, H = 24;
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  for (let y = 1; y < H - 1; y++) for (let x = 5; x <= 18; x++) g[y][x] = '.';
  for (let y = 2; y <= H - 6; y += 6) {
    for (let yy = y; yy < y + 4; yy++) {
      for (let x = 1; x <= 3; x++) g[yy][x] = '.';
      for (let x = 20; x <= 22; x++) g[yy][x] = '.';
    }
    g[y + 1][4] = '.';
    g[y + 1][19] = '.';
  }
  return g.map(r => r.join(''));
}

function genCorridors() {
  // tight 1-tile warren
  const W = 24, H = 24;
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  for (let y = 1; y < H - 1; y += 3) for (let x = 1; x < W - 1; x++) g[y][x] = '.';
  for (let x = 2; x < W - 1; x += 5) for (let y = 1; y < H - 1; y++) g[y][x] = '.';
  g[10][12] = 'K';   // power switch, deep in the warren
  g[22][2] = 'X';    // exit, far corner
  return g.map(r => r.join(''));
}

function genRings() {
  // concentric rings with breaches on every side
  const W = 24, H = 24;
  const g = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) row.push('.');
    g.push(row);
  }
  const insets = [2, 6, 10];
  const mid = 12;
  for (const inset of insets) {
    const x0 = inset, y0 = inset, x1 = W - 1 - inset, y1 = H - 1 - inset;
    for (let x = x0; x <= x1; x++) { g[y0][x] = '#'; g[y1][x] = '#'; }
    for (let y = y0; y <= y1; y++) { g[y][x0] = '#'; g[y][x1] = '#'; }
    g[y0][mid - 1] = '.'; g[y0][mid] = '.';
    g[y1][mid - 1] = '.'; g[y1][mid] = '.';
    g[mid - 1][x0] = '.'; g[mid][x0] = '.';
    g[mid - 1][x1] = '.'; g[mid][x1] = '.';
  }
  for (let x = 0; x < W; x++) { g[0][x] = '#'; g[H - 1][x] = '#'; }
  for (let y = 0; y < H; y++) { g[y][0] = '#'; g[y][W - 1] = '#'; }
  g[11][11] = 'K';   // switch in the core
  g[20][20] = 'X';   // exit in the outer ring
  return g.map(r => r.join(''));
}

function mapIndexById(id) {
  for (let i = 0; i < MAPS.length; i++) if (MAPS[i].id === id) return i;
  return 0;

function parseMap() {
  const src = MAPS[selectedMap] || MAPS[0];
  const rowsSrc = src.rows;
  indoorMode = !!mapStyle().indoor;
  mapSpecials = { key: null, exit: null };
  mapDoors = {};
  doorList = [];
  MH = rowsSrc.length;
  MW = 0;
  for (let i = 0; i < MH; i++) MW = Math.max(MW, rowsSrc[i].length);
  map = [];
  for (let y = 0; y < MH; y++) {
    const row = [];
    for (let x = 0; x < MW; x++) {
      const ch = rowsSrc[y][x] || '#';
      row.push(ch === '#' ? 1 : 0);
      if (ch === 'K') mapSpecials.key = { x: x + 0.5, y: y + 0.5 };
      else if (ch === 'X') mapSpecials.exit = { x: x + 0.5, y: y + 0.5 };
      else if (ch === 'D') {
        const d = { x, y, open: 0, target: 0, t: 0 };
        mapDoors[y * MW + x] = d;
        doorList.push(d);
      }
    }
    map.push(row);
  }
}

function doorAt(cx, cy) {
  return mapDoors[cy * MW + cx] || null;
}

function solidAt(cx, cy) {
  if (cx < 0 || cy < 0 || cx >= MW || cy >= MH) return true;
  if (map[cy][cx] === 1) return true;
  const d = mapDoors[cy * MW + cx];
  if (d) return d.open < 0.82;
  return false;
}

function isWall(x, y) {
  return solidAt(Math.floor(x), Math.floor(y));
}

function updateDoors(dt) {
  for (const d of doorList) {
    const dcx = d.x + 0.5, dcy = d.y + 0.5;

    // automatic: any nearby body — you or a zombie — holds it open
    let near = false;
    if (state === 'play' && Math.hypot(PLAYER.x - dcx, PLAYER.y - dcy) < 2.7) near = true;
    if (!near) {
      for (const b of bots) {
        if (!b.alive) continue;
        if (Math.hypot(b.x - dcx, b.y - dcy) < 2.3) { near = true; break; }
      }
    }

    if (near) {
      d.away = 0;
      d.target = 1;
    } else {
      d.away = (d.away || 0) + dt;
      if (d.away > 0.5) d.target = 0;
    }

    const goal = d.target;
    if (Math.abs(d.open - goal) < 0.002) { d.open = goal; continue; }
    d.open += (goal - d.open) * Math.min(1, dt * 5.5);
    if (Math.abs(d.open - goal) < 0.01) d.open = goal;
  }
}

// nearest door the player is facing, within reach
function findNearDoor() {
  let best = null, bestD = 2.6;
  for (const d of doorList) {
    const dx = (d.x + 0.5) - PLAYER.x;
    const dy = (d.y + 0.5) - PLAYER.y;
    const dist = Math.hypot(dx, dy);
    if (dist > bestD) continue;
    const ang = Math.atan2(dy, dx);
    if (Math.abs(norm(ang - PLAYER.ang)) > 0.9) continue;
    best = d;
    bestD = dist;
  }
  return best;
}

function toggleDoor() {
  if (state !== 'play') return;
  const d = findNearDoor();
  if (!d) return;
  d.target = d.target > 0.5 ? 0 : 1;
  d.t = 0;
  sound.door();
  sparkAt(d.x + 0.5, d.y + 0.5, 0.6, '#c8a06a', 6);
}

function floorCells() {
  const out = [];
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) if (map[y][x] === 0) out.push({ x: x + 0.5, y: y + 0.5, cx: x, cy: y });
  }
  return out;
}

function hashPass(s) {
  let h = 2166136261;
  const str = 'dbd:' + String(s || '');
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

function loginAs(name, pass) {
  const key = String(name || '').trim().replace(/\s+/g, ' ').toUpperCase().slice(0, 14);
  const pw = String(pass === undefined || pass === null ? '' : pass);
  if (!key) { loginError = 'ENTER A NAME'; return false; }

  const existing = accounts[key];

  if (existing) {
    if (existing.pass === undefined) {
      // older save from before passcodes existed — claim it with this passcode
      if (pw.length < 3) { loginError = 'SET A PASSCODE (3+ CHARS)'; return false; }
      existing.pass = hashPass(pw);
    } else if (existing.pass !== hashPass(pw)) {
      loginError = 'WRONG PASSCODE';
      sound.thud();
      return false;
    }
    currentUser = key;
    applyProfile(existing);
    saveAccounts();
  } else {
    if (pw.length < 3) { loginError = 'SET A PASSCODE (3+ CHARS)'; return false; }
    const p = freshProfile();
    p.pass = hashPass(pw);
    accounts[key] = p;
    currentUser = key;
    applyProfile(accounts[key]);
    saveAccounts();
  }

  loginError = '';
  nameInput = '';
  passInput = '';
  state = 'menu';
  startAmbience();
  tone(660, 0.08, 'triangle', 0.08);
  tone(880, 0.10, 'triangle', 0.07, null, 0.07);
  return true;
}

  loginError = '';

function computeSpawns() {
  const cells = floorCells();
  const pts = [];
  if (!cells.length) return pts;

  let best = cells[0], bestD = -1;
  for (const c of cells) if (Math.abs(c.x - MW / 2) + Math.abs(c.y - MH / 2) > bestD) { bestD = Math.abs(c.x - MW / 2) + Math.abs(c.y - MH / 2); best = c; }
  pts.push(best);

  while (pts.length < 8 && pts.length < cells.length) {
    let far = null, farD = -1;
    for (const c of cells) {
      let d = 1e9;
      for (const p of pts) d = Math.min(d, (c.x - p.x) * (c.x - p.x) + (c.y - p.y) * (c.y - p.y));
      if (d > farD) { farD = d; far = c; }
    }
    if (!far) break;
    pts.push(far);
  }
  // add mid points
  for (let i = 0; i < cells.length && pts.length < 10; i += Math.max(1, Math.floor(cells.length / 10))) {
    pts.push(cells[i]);
  }
  return pts;
}

    if (wave >= 2) return { shambler: 35, runner: 35, crawler: 15, spitter: 10, healer: 5 };
    return { shambler: 60, runner: 30, crawler: 10 };
  }
  return chapter().mix;
}

function pickZombieType() {
  const mix = zombieMix();
  let total = 0;
  for (const k in mix) total += mix[k];
  let r = Math.random() * total;
  for (const k in mix) {
    r -= mix[k];
    if (r <= 0) return k;
  }
  return 'shambler';
}

function makeBot(idx) {
  let pt = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  let tries = 0;
  while (pt && Math.hypot(pt.x - PLAYER.x, pt.y - PLAYER.y) < 8 && tries++ < 20) {
    pt = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  }
  const s = spawnAt(pt || { x: 2.5, y: 2.5 });
  const type = pickZombieType();
  const T = ZOMBIE_TYPES[type];
  const lvl = 1 + chapterIndex * 1.6 + (phase === 'escape' ? 1.2 : 0);
  const hpScale = (1 + Math.min(1.6, (lvl - 1) * 0.16)) * (chapter().hpMul || 1);
  const spMul = chapter().speedMul || 1;

  return {
    id: idx,
    type,
    name: T.name,
    x: s.x, y: s.y, ang: 0,
    hp: Math.round(T.hp * hpScale), maxHp: Math.round(T.hp * hpScale),
    alive: true, respawn: 0,
    speed: T.speed * (1 + Math.min(0.35, (lvl - 1) * 0.05)) * spMul * rand(0.92, 1.08),
    reach: T.reach,
    dmg: T.dmg * (1 + Math.min(1.2, (lvl - 1) * 0.12)),
    reward: T.reward,
    attackCd: rand(0.4, 1.2),
    windupT: 0,
    windup: T.windup,
    attackCdMax: T.attackCd,
    height: T.height,
    width: T.width,
    skin: T.skin, skinDark: T.skinDark, shirt: T.shirt, pants: T.pants, eyes: T.eyes,
    armor: T.armor === undefined ? 1 : T.armor,
    ranged: !!T.ranged,
    support: T.support || null,
    supportT: rand(2.5, 5.5),
    phase: rand(0, TAU),
    hitFlash: 0,
    hitKick: 0,
    deathT: 0,
    lurch: rand(0.7, 1.3),
    path: [], pathT: 0
  };
}

function botCountForMode() {
  return phase === 'find' ? 3 : 6;
}

function respawnBot(bot) {
  const pt = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
  const s = spawnAt(pt);
  bot.x = s.x; bot.y = s.y;
  bot.hp = bot.maxHp;
  bot.alive = true;
  bot.respawn = 0;
  bot.deathT = 0;
  bot.path = [];
  bot.attackCd = rand(0.6, 1.6);
  bot.windupT = 0;
  bot.hitFlash = 0;
}

// grid BFS path
function findPath(sx, sy, tx, ty) {
  sx = Math.floor(sx); sy = Math.floor(sy);
  tx = Math.floor(tx); ty = Math.floor(ty);
  if (sx === tx && sy === ty) return [];
  const key = (x, y) => y * MW + x;
  const prev = new Map();
  const startK = key(sx, sy);
  prev.set(startK, null);
  const q = [[sx, sy]];
  let head = 0;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let found = false;

  while (head < q.length && q.length < 2000) {
    const [x, y] = q[head++];
    if (x === tx && y === ty) { found = true; break; }
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      if (solidAt(nx, ny)) continue;
      const k = key(nx, ny);
      if (prev.has(k)) continue;
      prev.set(k, key(x, y));
      q.push([nx, ny]);
    }
  }
  if (!found) return [];

  const out = [];
  let cur = key(tx, ty);
  let guard = 0;
  while (cur !== startK && guard++ < 1000) {
    const p = prev.get(cur);
    if (p === undefined || p === null) break;
    out.push({ x: (cur % MW) + 0.5, y: Math.floor(cur / MW) + 0.5 });
    cur = p;
  }
  out.reverse();
  return out;
}

// line of sight between two world points
function lineOfSight(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const d = Math.hypot(dx, dy);
  if (d < 0.001) return true;
  const steps = Math.ceil(d * 8);
  const ux = dx / d, uy = dy / d;
  for (let i = 1; i < steps; i++) {
    if (isWall(ax + ux * (d * i / steps), ay + uy * (d * i / steps))) return false;
  }
  return true;
}

function wallDistance(ax, ay, ux, uy, maxD) {
  const d = Math.hypot(ux, uy);
  if (d < 1e-6) return 0;
  const nx = ux / d, ny = uy / d;
  let t = 0;
  while (t < maxD) {
    t += 0.05;
    if (isWall(ax + nx * t, ay + ny * t)) return t;
  }
  return maxD;
}

// ============================================================
//  INPUT
// ============================================================
const keys = { fwd: false, back: false, left: false, right: false, slide: false,
               lookL: false, lookR: false, lookU: false, lookD: false };
let firing = false;
let adsHeld = false;
let fireBuffer = 0;   // buffers a click so it isn't eaten by cooldowns/switches

function onKeyDown(e) {
  const c = e.code;
  if (c === 'Space' || c === 'Tab') e.preventDefault();

  if (state === 'menu') {
    if (c === 'Digit1') { menuModeIndex = 0; return; }
    if (c === 'Digit2') { menuModeIndex = 1; return; }
    if (c === 'Digit3') { menuModeIndex = 2; return; }
    if (c === 'Digit4') { menuModeIndex = 3; return; }
    if (c === 'KeyS') { state = 'shop'; shopMsg = null; return; }
    if (c === 'ArrowLeft' || c === 'KeyA') {
      menuModeIndex = (menuModeIndex + 3) % 4;
      tone(440, 0.05, 'square', 0.04);
      return;
    }
    if (c === 'ArrowRight' || c === 'KeyD') {
      menuModeIndex = (menuModeIndex + 1) % 4;
      tone(520, 0.05, 'square', 0.04);
      return;
    }
    if (c === 'Enter' || c === 'Space') {
      if (menuModeIndex === 0) {
        if (menuChapter <= progress) startChapter(menuChapter);
      } else {
        startVote(FREE_MODES[menuModeIndex - 1]);
      }
      return;
    }
    return;
  }

  if (state === 'vote') {
    if (c === 'Digit1') { castVote(0); return; }
    if (c === 'Digit2') { castVote(1); return; }
    if (c === 'Digit3') { castVote(2); return; }
    if (c === 'Digit4') { castVote(3); return; }
    if (c === 'Escape') { state = 'menu'; return; }
    return;
  }

  if (state === 'shop') {
    if (c === 'Escape' || c === 'Backspace' || c === 'KeyS') { state = 'menu'; return; }
    if (c === 'Digit1') { shopCategory = 'main'; return; }
    if (c === 'Digit2') { shopCategory = 'secondary'; return; }
    if (c === 'Digit3') { shopCategory = 'bomb'; return; }
    if (c === 'Digit4') { shopCategory = 'knife'; return; }
    return;
  }

  if (c === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; return; }

  if (state === 'login') {
    if (c === 'Tab') { activeField = activeField === 'name' ? 'pass' : 'name'; loginError = ''; return; }
    if (c === 'Backspace') {
      if (activeField === 'name') nameInput = nameInput.slice(0, -1);
      else passInput = passInput.slice(0, -1);
      loginError = '';
      return;
    }
    if (c === 'Enter' || c === 'NumpadEnter') { loginAs(nameInput, passInput); return; }
    if (c === 'Escape') {
      nameInput = ''; passInput = ''; loginError = ''; activeField = 'name';
      return;
    }
    const ch = e.key;
    if (typeof ch === 'string' && ch.length === 1) {
      if (activeField === 'name') {
        if (/[a-zA-Z0-9 _\-]/.test(ch) && nameInput.length < 14) { nameInput += ch.toUpperCase(); loginError = ''; }
      } else if (ch.charCodeAt(0) >= 32 && passInput.length < 24) {
        passInput += ch;
        loginError = '';
      }
    }
    return;
  }
  if (c === 'BracketLeft') { adjustSens(-0.1); return; }
  if (c === 'BracketRight') { adjustSens(0.1); return; }

  if (state === 'paused') {
    if (c === 'Escape') { state = 'play'; requestLock(); return; }
    if (c === 'KeyQ') { quitToMenu(); return; }
    return;
  }

  if (state === 'won' || state === 'lost') {
    if (c === 'Enter' || c === 'Space' || c === 'KeyR') { startChapter(chapterIndex); return; }
    if (c === 'Escape' || c === 'KeyQ') { quitToMenu(); return; }
    return;
  }

  if (state !== 'play') return;

  switch (c) {
    case 'KeyW': keys.fwd = true; break;
    case 'KeyS': keys.back = true; break;
    case 'KeyA': keys.left = true; break;
    case 'KeyD': keys.right = true; break;
    case 'ArrowLeft': keys.lookL = true; break;
    case 'ArrowRight': keys.lookR = true; break;
    case 'ArrowUp': keys.lookU = true; break;
    case 'ArrowDown': keys.lookD = true; break;
    case 'ShiftLeft': case 'ShiftRight': keys.slide = true; break;
    case 'Space': jump(); break;
    case 'KeyR': startReload(); break;
    case 'Digit1': switchSlot('main'); break;
    case 'Digit2': switchSlot('secondary'); break;
    case 'Digit3': switchSlot('bomb'); break;
    case 'Digit4': switchSlot('knife'); break;
    case 'KeyQ': switchSlot(SLOTS[(SLOTS.indexOf(PLAYER.slot) + 3) % 4]); break;
    case 'Escape': pauseGame(); break;
  }
}

function onKeyUp(e) {
  switch (e.code) {
    case 'KeyW': keys.fwd = false; break;
    case 'KeyS': keys.back = false; break;
    case 'KeyA': keys.left = false; break;
    case 'KeyD': keys.right = false; break;
    case 'ArrowLeft': keys.lookL = false; break;
    case 'ArrowRight': keys.lookR = false; break;
    case 'ArrowUp': keys.lookU = false; break;
    case 'ArrowDown': keys.lookD = false; break;
    case 'ShiftLeft': case 'ShiftRight': keys.slide = false; break;
  }
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

function look(dx, dy) {
  const base = locked ? 0.0026 : 0.0034;
  const sens = base * PLAYER.sens * (1 - PLAYER.ads * 0.42);
  PLAYER.ang = norm(PLAYER.ang + dx * sens);
  PLAYER.pitch = clamp(PLAYER.pitch - dy * 1.7 * PLAYER.sens * (1 - PLAYER.ads * 0.42), -220, 220);
}

function onMouseMove(e) {
  if (state !== 'play') return;
  const dx = e.movementX || 0;
  const dy = e.movementY || 0;
  if (!dx && !dy) return;

  if (locked) { look(dx, dy); return; }

  // Fallback when pointer lock is unavailable (common on laptops/trackpads):
  // hold the right mouse button and drag to look around.
  if ((e.buttons & 2) !== 0) { look(dx, dy); }
}

document.addEventListener('mousemove', onMouseMove);

cv.addEventListener('mousedown', (e) => {
  initAudio();
  const mx = e.clientX, my = e.clientY;

  if (state === 'login') {
    const lay = layoutLogin();
    if (cardHovered(lay.nameField, mx, my)) { activeField = 'name'; return; }
    if (cardHovered(lay.passField, mx, my)) { activeField = 'pass'; return; }
    for (const card of lay.cards) {
      if (!cardHovered(card, mx, my)) continue;
      nameInput = card.name;
      passInput = '';
      activeField = 'pass';
      loginError = '';
      tone(520, 0.05, 'square', 0.04);
      return;
    }
    return;
  }

  if (state === 'vote') {
    const vl = layoutVote();
    for (const card of vl.cards) {
      if (cardHovered(card, mx, my)) { castVote(card.index); return; }
    }
    return;
  }

  if (state === 'menu') {
    const lay = layoutMenu();
    if (cardHovered(lay.switchBtn, mx, my)) { logoutToLogin(); return; }

    for (const card of lay.modes) {
      if (!cardHovered(card, mx, my)) continue;
      if (menuModeIndex !== card.index) {
        menuModeIndex = card.index;
        tone(520, 0.05, 'square', 0.04);
      }
      return;
    }

    if (menuModeIndex === 0) {
      for (const card of lay.chapters) {
        if (!cardHovered(card, mx, my)) continue;
        if (card.index > progress) { sound.thud(); return; }
        if (menuChapter === card.index) startChapter(card.index);
        else { menuChapter = card.index; tone(520, 0.05, 'square', 0.04); }
        return;
      }
    } else {
      for (const card of lay.maps) {
        if (!cardHovered(card, mx, my)) continue;
        if (menuMapIndex === card.index) startVote(FREE_MODES[menuModeIndex - 1]);
        else { menuMapIndex = card.index; tone(460, 0.05, 'square', 0.04); }
        return;
      }
    }

    for (const chip of lay.classes) {
      if (!cardHovered(chip, mx, my)) continue;
      if (chosenClass !== chip.index) {
        chosenClass = chip.index;
        saveProfile();
        tone(600, 0.05, 'square', 0.04);
      }
      return;
    }

    if (cardHovered(lay.shop, mx, my)) { state = 'shop'; shopMsg = null; return; }
    if (cardHovered(lay.deploy, mx, my)) {
      if (menuModeIndex === 0) {
        if (menuChapter <= progress) startChapter(menuChapter);
      } else {
        startVote(FREE_MODES[menuModeIndex - 1]);
      }
      return;
    }
    return;
  }

  if (state === 'shop') {
    const lay = layoutShop();
    for (const tab of lay.tabs) {
      if (!cardHovered(tab, mx, my)) continue;
      if (shopCategory !== tab.key) {
        shopCategory = tab.key;
        tone(520, 0.05, 'square', 0.04);
      }
      return;
    }
    for (const card of lay.cards) {
      if (!cardHovered(card, mx, my)) continue;
      if (owned[card.id]) equipWeapon(card.id);
      else buyWeapon(card.id);
      return;
    }
    if (cardHovered(lay.back, mx, my)) { state = 'menu'; return; }
    return;
  }

  if (state === 'won' || state === 'lost') { startChapter(chapterIndex); return; }
  if (state === 'paused') { state = 'play'; requestLock(); return; }
  if (state === 'play') {
    if (!locked) requestLock();
    if (e.button === 0) { firing = true; fireBuffer = 0.22; }
    if (e.button === 2) adsHeld = true;
  }
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 0) firing = false;
  if (e.button === 2) adsHeld = false;
});

window.addEventListener('wheel', (e) => {
  if (state !== 'play') return;
  const i = SLOTS.indexOf(PLAYER.slot);
  const next = (i + (e.deltaY > 0 ? 1 : 3)) % 4;
  switchSlot(SLOTS[next]);
}, { passive: true });

window.addEventListener('contextmenu', (e) => e.preventDefault());

function requestLock() {
  try {
    const p = cv.requestPointerLock ? cv.requestPointerLock() : null;
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv;
  if (!locked && state === 'play') pauseGame();
});

document.addEventListener('pointerlockerror', () => { locked = false; });

// ============================================================
//  PLAYER ACTIONS
// ============================================================
function jump() {
  if (!PLAYER.alive || !PLAYER.onGround) return;
  PLAYER.vz = 4.6;
  PLAYER.onGround = false;
  sound.jump();
}

function switchSlot(slot) {
  if (PLAYER.slot === slot) return;
  PLAYER.slot = slot;
  PLAYER.reloadT = 0;
  PLAYER.fireCd = Math.max(PLAYER.fireCd, 0.15);
  PLAYER.drawT = 1;                 // raise animation
  tone(500, 0.04, 'square', 0.03);
}

function currentWeapon() { return PLAYER.loadout[PLAYER.slot]; }
function currentAmmo() { return PLAYER.ammo[PLAYER.slot]; }

function startReload() {
  const w = currentWeapon();
  if (!w || w.melee) return;
  if (PLAYER.reloadT > 0) return;
  if (PLAYER.ammo[PLAYER.slot] >= w.mag) return;
  PLAYER.reloadT = w.reload;
  sound.reload();
}

function finishReload() {
  const w = currentWeapon();
  PLAYER.ammo[PLAYER.slot] = w.mag;
}

// ============================================================
//  SHOOTING
// ============================================================
function shoot() {
  const w = currentWeapon();
  if (!w) return false;
  if (PLAYER.reloadT > 0) return false;
  if (PLAYER.fireCd > 0) return false;

  if (w.melee) {
    PLAYER.fireCd = 60 / w.rpm;
    PLAYER.kick = 1;
    PLAYER.slash = 1;
    sound.melee();
    let hitAny = false;
    for (const b of bots) {
      if (!b.alive) continue;
      const dx = b.x - PLAYER.x, dy = b.y - PLAYER.y;
      const d = Math.hypot(dx, dy);
      // generous: the bot's body radius counts too, so "close enough" really is close enough
      if (d > w.range + 0.5) continue;
      const a = Math.atan2(dy, dx);
      if (Math.abs(norm(a - PLAYER.ang)) > 1.05) continue;
      damageBot(b, w.dmg);
      hitAny = true;
      PLAYER.hitFlash = 1;
    }
    if (hitAny) sound.hit();
    else sound.whiff();
    return true;
  }

  if (PLAYER.ammo[PLAYER.slot] <= 0) { startReload(); return false; }

  PLAYER.ammo[PLAYER.slot]--;
  PLAYER.fireCd = 60 / w.rpm;
  PLAYER.kick = 1;
  PLAYER.recoil = Math.min(1, PLAYER.recoil + 0.35);
  sound.shot(w.power || 1);
  screenShake = Math.min(8, screenShake + (w.power || 1) * 2.2);

  // brass flies out of the ejection port
  if (!w.projectile) {
    const ej = PLAYER.ang + 1.35;
    particles.push({
      x: PLAYER.x + Math.cos(ej) * 0.5,
      y: PLAYER.y + Math.sin(ej) * 0.5,
      z: PLAYER.camZ - 0.06,
      vx: Math.cos(ej) * rand(1.4, 2.6),
      vy: Math.sin(ej) * rand(1.4, 2.6),
      vz: rand(1.6, 3.2),
      life: 0.8, max: 0.8, color: '#d8a95a', size: 0.028
    });
  }

  if (w.projectile) {
    launchProjectile(w);
    return true;
  }

  const pellets = w.pellets || 1;
  const spread = w.spread * (1 - PLAYER.ads * 0.82);
  for (let i = 0; i < pellets; i++) {
    const ang = PLAYER.ang + rand(-spread, spread) + (pellets > 1 ? rand(-1, 1) * spread : 0);
    hitscan(ang, w);
  }
  return true;
}

function hitscan(ang, w) {
  const ox = PLAYER.x, oy = PLAYER.y;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const maxD = w.range;

  let bestT = wallDistance(ox, oy, ux, uy, maxD);
  let bestBot = null;

  for (const b of bots) {
    if (!b.alive) continue;
    const ex = b.x - ox, ey = b.y - oy;
    const proj = ex * ux + ey * uy;
    if (proj <= 0 || proj > bestT) continue;
    const perp2 = (ex * ex + ey * ey) - proj * proj;
    const r2 = 0.42 * 0.42;
    if (perp2 > r2) continue;
    bestT = proj;
    bestBot = b;
  }

  // tracer to hit point (start slightly ahead so it isn't behind the camera)
  tracers.push({
    x1: ox + ux * 0.6, y1: oy + uy * 0.6,
    x2: ox + ux * bestT, y2: oy + uy * bestT,
    life: 0.07, max: 0.07, color: '#9fe8ff'
  });

  if (bestBot) {
    damageBot(bestBot, w.dmg);
    sound.hit();
    PLAYER.hitFlash = 1;
  } else {
    // wall spark
    if (bestT < maxD - 0.01) {
      sparkAt(ox + ux * bestT, oy + uy * bestT, 0.55, '#9fd8ff', 6);
    }
  }
}

function launchProjectile(w) {
  const speed = w.speed;
  const dirX = Math.cos(PLAYER.ang), dirY = Math.sin(PLAYER.ang);
  projectiles.push({
    x: PLAYER.x + dirX * 0.4,
    y: PLAYER.y + dirY * 0.4,
    z: PLAYER.camZ - 0.1,
    vx: dirX * speed,
    vy: dirY * speed,
    vz: 2.2,
    life: w.fuse > 0 ? w.fuse : 6,
    w: w,
    color: w.id === 'rocket' ? '#ffd27a' : '#9dff9d',
    size: w.id === 'rocket' ? 0.22 : 0.16
  });
}

function damageBot(bot, dmg) {
  if (!bot.alive) return;
  bot.hp -= dmg * currentClass().dmg * (bot.armor === undefined ? 1 : bot.armor);
  bot.hitFlash = 1;
  bot.hitKick = 1;
  sparkAt(bot.x, bot.y, 0.7, bot.type === 'armored' ? '#c9d8e8' : '#7d1420', 5);
  if (bot.hp <= 0) killBot(bot);
}

function killBot(bot) {
  bot.alive = false;
  bot.respawn = 2.8;
  bot.deathT = 0.001;
  score.you++;
  PLAYER.kills++;
  sound.kill();

  const reward = bot.reward + (phase === 'escape' ? 6 : 0);
  addCash(reward);
  stats.kills++;
  score.you++;

  const cls = currentClass();
  if (cls.heal > 0 && PLAYER.alive) {
    PLAYER.hp = Math.min(PLAYER.maxHp, PLAYER.hp + cls.heal);
    sparkAt(PLAYER.x, PLAYER.y, 0.8, '#7dffb0', 6);
  }

  sparkAt(bot.x, bot.y, 1.0, '#7d1420', 26);
  sparkAt(bot.x, bot.y, 0.8, '#c9d2a8', 10);
  floaters.push({ x: bot.x, y: bot.y, text: '+$' + reward, life: 1.2, color: '#8dffb0' });

  if (sessionMode === 'chapters') {
    phaseKills++;
    const left = Math.max(0, phaseQuota - phaseKills);
    if (left === 0) {
      pushFeed('AREA CLEAR — MOVE');
      tone(880, 0.14, 'triangle', 0.10);
      tone(1174, 0.18, 'triangle', 0.09, null, 0.1);
    } else {
      pushFeed('DOWN: ' + bot.name + '  ' + phaseKills + '/' + phaseQuota + '  +$' + reward);
    }
  } else {
    if (sessionMode === 'randomizer') rerollOnKill();
    pushFeed('DOWN: ' + bot.name + '  +$' + reward);
    if (sessionMode === 'normal' && score.you >= 5) winMatch();
  }
}

function damagePlayer(dmg, fromX, fromY) {
  if (!PLAYER.alive || state !== 'play') return;
  PLAYER.hp -= dmg;
  PLAYER.dmgFlash = 1;
  screenShake = Math.min(14, screenShake + 5);
  sound.hurt();
  if (PLAYER.hp <= 0) {
    PLAYER.hp = 0;
    PLAYER.alive = false;
    PLAYER.deaths++;
    score.them++;
    stats.matches++;
    saveProfile();
    pushFeed('YOU DIED');
    sound.lose();
    loseMatch();
  }
}

function startVote(mode) {
  voteMode = mode;
  voteMine = -1;
  voteResult = -1;
  voteTimer = 10;

  // four random arenas to choose between
  const pool = MAPS.map((m, i) => i);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  voteOptions = pool.slice(0, 4);
  voteCounts = voteOptions.map(() => 0);

  // a few other survivors in the lobby, voting at their own pace
  voteBots = [];
  const others = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < others; i++) {
    voteBots.push({
      t: rand(0.8, 8.5),
      pick: Math.floor(Math.random() * voteOptions.length),
      voted: false
    });
  }

  state = 'vote';
  if (document.exitPointerLock) document.exitPointerLock();
  tone(520, 0.08, 'triangle', 0.05);
}

function castVote(i) {
  if (state !== 'vote') return;
  if (i < 0 || i >= voteOptions.length) return;
  if (voteMine === i) return;
  if (voteMine >= 0) voteCounts[voteMine] = Math.max(0, voteCounts[voteMine] - 1);
  voteMine = i;
  voteCounts[i]++;
  tone(660, 0.05, 'square', 0.05);
}

function resolveVote() {
  let best = 0;
  for (let i = 1; i < voteCounts.length; i++) {
    if (voteCounts[i] > voteCounts[best]) best = i;
  }
  // a tie goes to the player's pick
  if (voteMine >= 0 && voteCounts[voteMine] === voteCounts[best]) best = voteMine;
  voteResult = voteOptions[best];
  startFreePlay(voteMode, voteResult);
}

function updateVote(dt) {
  voteTimer -= dt;

  for (const b of voteBots) {
    if (b.voted) continue;
    b.t -= dt;
    if (b.t <= 0) {
      b.voted = true;
      voteCounts[b.pick]++;
      tone(440, 0.04, 'sine', 0.03);
    }
  }

  if (voteTimer <= 0) resolveVote();
}

function freePlayTick(dt) {
  matchTime += dt;
  const waveLen = 22;
  const target = Math.min(10, 3 + Math.floor(matchTime / waveLen));

  let alive = 0;
  for (const b of bots) if (b.alive) alive++;

  spawnTimer -= dt;
  if (alive < target && bots.length < 28 && spawnTimer <= 0) {
    spawnTimer = 1.1;
    spawnHorde(1);
  }

  const w = 1 + Math.floor(matchTime / waveLen);
  if (w > wave) {
    wave = w;
    waveBanner = { text: 'WAVE ' + w, life: 2.0, max: 2.0 };
    addCash(20);
    pushFeed('WAVE ' + w + '  +$20');
    tone(440, 0.12, 'triangle', 0.08);

function updateObjective(dt) {
  if (state !== 'play') return;
  if (sessionMode !== 'chapters') { freePlayTick(dt); return; }
  if (hintCd > 0) hintCd -= dt;

  const left = Math.max(0, phaseQuota - phaseKills);
  const ready = left === 0;

  if (phase === 'find' && hatch) {
    const d = Math.hypot(PLAYER.x - hatch.x, PLAYER.y - hatch.y);
    proximity = clamp(1 - d / 26, 0, 1);
    if (d < 1.4) {
      if (ready) descendIntoBunker();
      else nudge('NOT YET — ' + left + ' STILL MOVING');
    }
  } else if (phase === 'switch') {
    const k = mapSpecials.key;
    if (k) {
      const d = Math.hypot(PLAYER.x - k.x, PLAYER.y - k.y);
      proximity = clamp(1 - d / 26, 0, 1);
      if (d < 1.6) {
        if (!ready) {
          nudge('SWITCH LOCKED — ' + left + ' STILL MOVING');
        } else {
          hasKey = true;
          phase = 'escape';
          phaseQuota = chapter().quota.escape;
          phaseKills = 0;
          spawnTimer = 0.8;
          spawnHorde(Math.min(8, 3 + Math.floor(phaseQuota * 0.5)));
          pushFeed('POWER ON — ESCAPE!');
          tone(660, 0.2, 'triangle', 0.12);
          tone(880, 0.3, 'triangle', 0.10, null, 0.15);
          fadeT = 0.7;
        }
      }
    }
  } else if (phase === 'escape') {
    const x = mapSpecials.exit;
    if (x) {
      const d = Math.hypot(PLAYER.x - x.x, PLAYER.y - x.y);
      proximity = clamp(1 - d / 26, 0, 1);
      if (d < 1.6) {
        if (ready) completeChapter();
        else nudge('EXIT SEALED — ' + left + ' STILL MOVING');
      }
    }
  }

  // trickle of zombies until the quota is met
  spawnTimer -= dt;
  if (!ready && spawnTimer <= 0) {
    spawnTimer = rand(1.4, 2.8);
    let alive = 0;
    for (const b of bots) if (b.alive) alive++;
    const maxAlive = 6 + chapterIndex * 2;
    if (alive < maxAlive && bots.length < 24) spawnHorde(1);
  }

  if (fadeT > 0) fadeT = Math.max(0, fadeT - dt * 0.6);
}

function nudge(text) {
  if (hintCd > 0) return;
  hintCd = 2.4;
  pushFeed(text);
  sound.thud();
}

function pickHatchSpot() {
  const cells = floorCells();
  let best = null, bestD = -1;
  for (let tries = 0; tries < 60; tries++) {
    const c = cells[Math.floor(Math.random() * cells.length)];
    if (!c) break;
    const d = Math.hypot(c.x - PLAYER.x, c.y - PLAYER.y);
    if (d > bestD) { bestD = d; best = c; }
    if (d > 13) break;
  }
  return best || { x: PLAYER.x + 5, y: PLAYER.y };
}

function spawnHorde(n) {
  for (let i = 0; i < n; i++) bots.push(makeBot(bots.length));
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  firing = false;
  keys.fwd = keys.back = keys.left = keys.right = keys.slide = false;
  if (document.exitPointerLock) document.exitPointerLock();
}

function winMatch() {

function loseMatch() {
