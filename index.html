function pushFeed(text) {
  feed.unshift({ text, life: 4.5 });
  if (feed.length > 5) feed.pop();
}

function sparkAt(x, y, z, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, z: typeof z === 'number' ? z : 0.55,
      vx: rand(-2.4, 2.4), vy: rand(-2.4, 2.4), vz: rand(0.4, 3.2),
      life: rand(0.3, 0.75), max: 0.75, color, size: rand(0.02, 0.05)
    });
  }
}

function explode(x, y, z, w) {
  sound.boom();
  screenShake = Math.min(16, screenShake + 10);
  sparkAt(x, y, z, '#ffb347', 34);
  sparkAt(x, y, z, '#fff3c4', 16);
  for (const b of bots) {
    if (!b.alive) continue;
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < w.splash) {
      const falloff = 1 - d / w.splash;
      damageBot(b, Math.max(12, w.dmg * falloff));
    }
  }
  const pd = Math.hypot(PLAYER.x - x, PLAYER.y - y);
  if (pd < w.splash * 0.8) {
    damagePlayer(Math.max(6, w.dmg * 0.35 * (1 - pd / (w.splash * 0.8))), x, y);
  }
}

// ============================================================
//  UPDATE
// ============================================================
function updatePlayer(dt) {
  if (!PLAYER.alive) return;

  // ---- keyboard look (always available, no pointer lock needed)
  const lookSpeed = 2.4;
  if (keys.lookL) PLAYER.ang = norm(PLAYER.ang - lookSpeed * dt);
  if (keys.lookR) PLAYER.ang = norm(PLAYER.ang + lookSpeed * dt);
  if (keys.lookU) PLAYER.pitch = clamp(PLAYER.pitch - 340 * dt, -220, 220);
  if (keys.lookD) PLAYER.pitch = clamp(PLAYER.pitch + 340 * dt, -220, 220);

  // ---- aim down sights
  const adsTarget = (adsHeld && PLAYER.alive) ? 1 : 0;
  PLAYER.ads = lerp(PLAYER.ads, adsTarget, 1 - Math.pow(0.0009, dt));

  // ---- movement
  let fwd = 0, side = 0;
  if (keys.fwd) fwd += 1;
  if (keys.back) fwd -= 1;
  if (keys.right) side += 1;
  if (keys.left) side -= 1;

  const len = Math.hypot(fwd, side);
  if (len > 1) { fwd /= len; side /= len; }

  const cos = Math.cos(PLAYER.ang), sin = Math.sin(PLAYER.ang);
  let wishX = cos * fwd - sin * side;
  let wishY = sin * fwd + cos * side;

  // ---- slide
  if (keys.slide && PLAYER.onGround && PLAYER.slideCd <= 0 && PLAYER.slideT <= 0 &&
      (Math.abs(fwd) + Math.abs(side)) > 0) {
    PLAYER.slideT = 0.85;
    PLAYER.slideCd = 1.5;
    sound.slide();
    sparkAt(PLAYER.x, PLAYER.y, 0.1, '#8fd8ff', 8);
  }
  if (PLAYER.slideT > 0) {
    PLAYER.slideT -= dt;
    if (PLAYER.slideT <= 0) PLAYER.slideCd = 0.7;
  }
  PLAYER.slideCd = Math.max(0, PLAYER.slideCd - dt);

  const sliding = PLAYER.slideT > 0;
  let speed = 4.6;
  if (sliding) speed = 8.2;
  if (!PLAYER.onGround) speed *= 0.85;
  speed *= (1 - PLAYER.ads * 0.32);
  speed *= currentClass().speed;

  PLAYER.vx = lerp(PLAYER.vx, wishX * speed, 1 - Math.pow(0.0001, dt));
  PLAYER.vy = lerp(PLAYER.vy, wishY * speed, 1 - Math.pow(0.0001, dt));

  const nx = PLAYER.x + PLAYER.vx * dt;
  const ny = PLAYER.y + PLAYER.vy * dt;

  if (!isWall(nx, PLAYER.y)) PLAYER.x = nx; else PLAYER.vx = 0;
  if (!isWall(PLAYER.x, ny)) PLAYER.y = ny; else PLAYER.vy = 0;

  // ---- jump / gravity
  if (!PLAYER.onGround) {
    PLAYER.vz -= 16 * dt;
    PLAYER.z += PLAYER.vz * dt;
    if (PLAYER.z <= 0) { PLAYER.z = 0; PLAYER.vz = 0; PLAYER.onGround = true; }
  }

  // ---- camera height
  const targetCam = 0.55 + PLAYER.z - (sliding ? 0.25 : 0);
  PLAYER.camZ = lerp(PLAYER.camZ, targetCam, 1 - Math.pow(0.0005, dt));

  // ---- bob
  const moving = Math.hypot(PLAYER.vx, PLAYER.vy);
  PLAYER.bob += dt * (sliding ? 3 : moving * 2.2);

  // ---- weapon
  PLAYER.fireCd = Math.max(0, PLAYER.fireCd - dt);
  PLAYER.recoil = Math.max(0, PLAYER.recoil - dt * 4.5);
  PLAYER.kick = Math.max(0, PLAYER.kick - dt * 5.5);
  PLAYER.slash = Math.max(0, PLAYER.slash - dt * 4.2);
  PLAYER.drawT = Math.max(0, PLAYER.drawT - dt * 4.2);

  // weapon sway lags behind the view
  const dAng = norm(PLAYER.ang - PLAYER.prevAng);
  const dPitch = PLAYER.pitch - PLAYER.prevPitch;
  PLAYER.prevAng = PLAYER.ang;
  PLAYER.prevPitch = PLAYER.pitch;
  PLAYER.swayX = clamp(PLAYER.swayX - dAng * 520, -34, 34);
  PLAYER.swayY = clamp(PLAYER.swayY - dPitch * 1.4, -26, 26);
  const swayDamp = Math.pow(0.0002, dt);
  PLAYER.swayX *= swayDamp;
  PLAYER.swayY *= swayDamp;

  if (PLAYER.reloadT > 0) {
    PLAYER.reloadT -= dt;
    if (PLAYER.reloadT <= 0) { PLAYER.reloadT = 0; finishReload(); }
  }

  const w = currentWeapon();
  if (w) {
    const wantFire = w.auto ? firing : fireBuffer > 0;
    if (wantFire) {
      if (shoot()) fireBuffer = 0;
    }
  }
  fireBuffer = Math.max(0, fireBuffer - dt);

  if (PLAYER.ammo[PLAYER.slot] === 0 && PLAYER.reloadT <= 0) startReload();

  PLAYER.hitFlash = Math.max(0, PLAYER.hitFlash - dt * 4);
  PLAYER.dmgFlash = Math.max(0, PLAYER.dmgFlash - dt * 2.2);
}

function updateBots(dt) {
  for (const b of bots) {
    if (!b.alive) {
      b.respawn -= dt;
      b.deathT = Math.min(1, b.deathT + dt * 1.6);
      const canRespawn = sessionMode !== 'chapters' || phaseKills < phaseQuota + 3;
      if (b.respawn <= 0 && canRespawn) respawnBot(b);
      continue;
    }

    b.hitFlash = Math.max(0, b.hitFlash - dt * 4);
    b.hitKick = Math.max(0, (b.hitKick || 0) - dt * 6);
    const dx = PLAYER.x - b.x, dy = PLAYER.y - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.01) b.ang = Math.atan2(dy, dx);

    // pathing (zombies always know roughly where you are)
    b.pathT -= dt;
    if (b.pathT <= 0) {
      b.pathT = rand(0.4, 0.8);
      b.path = findPath(b.x, b.y, PLAYER.x, PLAYER.y);
    }

    // ---- attack windup / swing
    const inReach = PLAYER.alive && (b.ranged
      ? (dist < b.reach && dist > 2.5)
      : dist < b.reach);
    if (b.windupT > 0) {
      b.windupT -= dt;
      if (b.windupT <= 0) {
        if (b.ranged) {
          if (PLAYER.alive) spitAcid(b);
        } else if (PLAYER.alive && dist < b.reach + 0.45) {
          damagePlayer(b.dmg, b.x, b.y);
          sound.bite();
          sparkAt(PLAYER.x, PLAYER.y, 0.7, '#a01f2a', 10);
        }
        b.attackCd = b.attackCdMax * rand(0.85, 1.2);
      }
    } else if (inReach && b.attackCd <= 0) {
      b.windupT = b.windup;
      sound.groan();
    }
    b.attackCd = Math.max(0, b.attackCd - dt);

    // ---- movement: lurch toward the player, small sway
    let mvx = 0, mvy = 0;
    if (dist > 0.01) { mvx = dx / dist; mvy = dy / dist; }

    if (b.ranged) {
      if (dist < 4.5) { mvx = -mvx; mvy = -mvy; }
      else if (dist < 11) {
        const tx2 = -dy / (dist || 1), ty2 = dx / (dist || 1);
        mvx = tx2 * 0.55; mvy = ty2 * 0.55;
      }
      if (!lineOfSight(b.x, b.y, PLAYER.x, PLAYER.y)) {
        mvx = 0; mvy = 0;
        while (b.path.length && Math.hypot(b.path[0].x - b.x, b.path[0].y - b.y) < 0.35) b.path.shift();
        if (b.path.length) {
          const wp = b.path[0];
          const wx = wp.x - b.x, wy = wp.y - b.y;
          const wd = Math.hypot(wx, wy) || 1;
          mvx = wx / wd; mvy = wy / wd;
        }
      }
    } else if (!inReach) {
      // if the straight line is blocked, follow the path
      if (!lineOfSight(b.x, b.y, PLAYER.x, PLAYER.y) && b.path.length) {
        while (b.path.length && Math.hypot(b.path[0].x - b.x, b.path[0].y - b.y) < 0.35) b.path.shift();
        if (b.path.length) {
          const wp = b.path[0];
          const wx = wp.x - b.x, wy = wp.y - b.y;
          const wd = Math.hypot(wx, wy) || 1;
          mvx = wx / wd; mvy = wy / wd;
        }
      }
    } else {
      mvx = 0; mvy = 0;   // stop and swipe
    }

    // shambling sway
    b.phase += dt * (2.2 * b.lurch + b.speed * 0.5);
    const sway = Math.sin(b.phase) * (b.type === 'runner' ? 0.03 : 0.09);
    const sp = b.speed * (b.windupT > 0 ? 0.25 : 1);
    const stepX = (mvx * sp - mvy * sway * sp) * dt;
    const stepY = (mvy * sp + mvx * sway * sp) * dt;
    if (!isWall(b.x + stepX, b.y)) b.x += stepX;
    if (!isWall(b.x, b.y + stepY)) b.y += stepY;

    // separation so they don't stack
    for (const o of bots) {
      if (o === b || !o.alive) continue;
      const ox = b.x - o.x, oy = b.y - o.y;
      const od = Math.hypot(ox, oy);
      const minD = 0.55 + (b.width - 0.8) * 0.4;
      if (od < minD && od > 0.001) {
        b.x += (ox / od) * 0.02;
        b.y += (oy / od) * 0.02;
      }
    }

    // support zombies
    if (b.support) {
      b.supportT -= dt;
      if (b.supportT <= 0) {
        if (b.support === 'necro') {
          b.supportT = 6.5;
          raiseDead(b);
        } else if (b.support === 'heal') {
          b.supportT = 1.5;
          healAllies(b);
        }
      }
    }
  }
}

function raiseDead(src) {
  let alive = 0;
  for (const o of bots) if (o.alive) alive++;
  if (alive >= 16) return;

  const nx = src.x + rand(-1.2, 1.2);
  const ny = src.y + rand(-1.2, 1.2);
  if (isWall(nx, ny)) return;

  bots.push(makeBot(bots.length));
  const nb = bots[bots.length - 1];
  nb.x = nx; nb.y = ny;
  nb.type = 'shambler';
  nb.name = 'REANIMATED';
  nb.hp = 60; nb.maxHp = 60;
  sparkAt(nx, ny, 0.8, '#a05cff', 18);
  sparkAt(nx, ny, 0.4, '#5c1a7a', 10);
  tone(160, 0.25, 'sawtooth', 0.08, 90);
  pushFeed('THE NECROMANCER RAISES THE DEAD');
}

function healAllies(src) {
  let healed = false;
  for (const o of bots) {
    if (!o.alive || o === src) continue;
    if (Math.hypot(o.x - src.x, o.y - src.y) > 5) continue;
    if (o.hp >= o.maxHp) continue;
    o.hp = Math.min(o.maxHp, o.hp + 14);
    healed = true;
    sparkAt(o.x, o.y, 0.9, '#7dffb0', 4);
  }
  if (healed) {
    sparkAt(src.x, src.y, 0.9, '#7dffb0', 8);
    tone(880, 0.08, 'sine', 0.04);
  }
}

function spitAcid(b) {
  const a = Math.atan2(PLAYER.y - b.y, PLAYER.x - b.x) + rand(-0.06, 0.06);
  acids.push({
    x: b.x, y: b.y, z: 1.3,
    vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, vz: 1.4,
    life: 4, dmg: b.dmg
  });
  sound.spit();
}

function updateAcids(dt) {
  for (let i = acids.length - 1; i >= 0; i--) {
    const a = acids[i];
    a.life -= dt;
    a.vz -= 12 * dt;
    a.z += a.vz * dt;

    if (a.z <= 0.06) { sparkAt(a.x, a.y, 0.1, '#8fff4a', 6); acids.splice(i, 1); continue; }

    const nx = a.x + a.vx * dt;
    const ny = a.y + a.vy * dt;
    if (isWall(nx, a.y) || isWall(a.x, ny)) {
      sparkAt(a.x, a.y, a.z, '#8fff4a', 6);
      acids.splice(i, 1);
      continue;
    }
    a.x = nx; a.y = ny;

    if (PLAYER.alive && Math.hypot(a.x - PLAYER.x, a.y - PLAYER.y) < 0.55) {
      damagePlayer(a.dmg, a.x, a.y);
      acids.splice(i, 1);
      continue;
    }
    if (a.life <= 0) acids.splice(i, 1);
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    p.vz -= (p.w.fuse > 0 ? 12 : 0.4) * dt;

    const nx = p.x + p.vx * dt;
    const ny = p.y + p.vy * dt;
    const nz = p.z + p.vz * dt;

    if (isWall(nx, p.y)) { p.vx *= -0.4; } else p.x = nx;
    if (isWall(p.x, ny)) { p.vy *= -0.4; } else p.y = ny;

    if (nz <= 0.05) {
      p.z = 0.05;
      if (p.w.fuse > 0) { p.vz = Math.abs(p.vz) * 0.5; }
      else { explode(p.x, p.y, p.z, p.w); projectiles.splice(i, 1); continue; }
    } else p.z = nz;

    let hitBot = false;
    for (const b of bots) {
      if (!b.alive) continue;
      if (Math.hypot(b.x - p.x, b.y - p.y) < 0.5) { hitBot = true; break; }
    }

    if (p.life <= 0 || hitBot) {
      explode(p.x, p.y, p.z, p.w);
      projectiles.splice(i, 1);
    }
  }
}

function updateEffects(dt) {
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    if (tracers[i].life <= 0) tracers.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vz -= 9 * dt;
    if (p.z < 0.02) { p.z = 0.02; p.vz *= -0.3; }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].life -= dt;
    floaters[i].y -= dt * 0.3;
    if (floaters[i].life <= 0) floaters.splice(i, 1);
  }
  for (let i = feed.length - 1; i >= 0; i--) {
    feed[i].life -= dt;
    if (feed[i].life <= 0) feed.splice(i, 1);
  }
  if (rerollFlash > 0) rerollFlash = Math.max(0, rerollFlash - dt);
  if (cashFlash > 0) cashFlash = Math.max(0, cashFlash - dt * 1.5);
  if (shopMsg) {
    shopMsg.life -= dt;
    if (shopMsg.life <= 0) shopMsg = null;
  }
  if (waveBanner) {
    waveBanner.life -= dt;
    if (waveBanner.life <= 0) waveBanner = null;
  }
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 40);
  if (hintT > 0) hintT -= dt;
}

function updateWaves(dt) {
  // chapters drive their own pacing — see updateObjective()
}

function update(dt) {
  if (state === 'vote') { updateVote(dt); updateEffects(dt * 0.5); return; }
  if (state !== 'play') { updateEffects(dt * 0.5); return; }
  updateDoors(dt);
  updatePlayer(dt);
  updateBots(dt);
  updateAcids(dt);
  updateProjectiles(dt);
  updateEffects(dt);
  updateObjective(dt);
}

// ============================================================
//  RENDER — raycast world
// ============================================================
const FOV = 1.05;
let FOV_ACTIVE = FOV;
let horizon = 0;
let projPlane = 1;
let zbuf = [];
let COLS = 0;
let COLW = 2;

function shadeHex(base, mul) {
  const n = parseInt(base.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(clamp(r * mul, 0, 255));
  g = Math.round(clamp(g * mul, 0, 255));
  b = Math.round(clamp(b * mul, 0, 255));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function tintRGBA(hex, a) {
  const n = parseInt(String(hex).slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function doorColour() {
  return mapStyle().door || '#7a5230';
}

function wallColor(cx, cy, side) {
  // per-arena palette, checker-shaded and darker on the north/south faces
  const base = mapStyle().wall;
  const even = ((cx + cy) % 2) === 0;
  let mul = even ? 1.06 : 0.94;
  if (side === 1) mul *= 0.86;
  return shadeHex(base, mul);
}

// ---- outdoor sky -------------------------------------------------
const STARS = (() => {
  const out = [];
  for (let i = 0; i < 160; i++) {
    out.push({ x: Math.random(), y: Math.random(), r: rand(0.5, 1.6), a: rand(0.25, 0.9) });
  }
  return out;
})();

const SKYLINE = (() => {
  const out = [];
  let h = 0.03;
  for (let i = 0; i < 220; i++) {
    h += rand(-0.010, 0.010);
    h = clamp(h, 0.008, 0.075);
    out.push(h);
  }
  return out;
})();

const TOWERS = (() => {
  const out = [];
  let x = 0;
  while (x < 220) {
    const w = Math.max(1, Math.round(rand(2, 7)));
    out.push({ i: x, w, h: rand(0.02, 0.075) });
    x += w + Math.round(rand(0, 3));
  }
  return out;
})();

function drawSky() {
  if (indoorMode) {
    // indoor ceiling tinted by the map (brown rooms get a red roof, bunkers concrete)
    const ceil = mapStyle().ceiling || '#5f656d';
    const g = ctx.createLinearGradient(0, Math.max(0, horizon - H * 0.7), 0, Math.max(1, horizon));
    g.addColorStop(0, shadeHex(ceil, 0.55));
    g.addColorStop(0.55, shadeHex(ceil, 0.85));
    g.addColorStop(1, shadeHex(ceil, 1.1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, Math.max(1, horizon));

    const off = (PLAYER.ang / TAU) * W * 1.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
      let lx = ((i / 9) * W - off) % W;
      if (lx < 0) lx += W;
      const ly = horizon - H * 0.09;
      const flick = 0.55 + Math.sin(tNow * 2.4 + i * 1.7) * 0.12;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.06);
      lg.addColorStop(0, 'rgba(255,225,170,' + (0.35 * flick).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(lx - W * 0.06, ly - W * 0.06, W * 0.12, W * 0.12);
    }
    ctx.restore();

    // dark haze where the ceiling meets the walls
    const haze = ctx.createLinearGradient(0, horizon - H * 0.08, 0, horizon + 2);
    haze.addColorStop(0, 'rgba(0,0,0,0)');
    haze.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizon - H * 0.08, W, H * 0.08 + 2);
    return;
  }

  // sky dome
  const g = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
  g.addColorStop(0, '#101c3a');
  g.addColorStop(0.45, '#2a3f68');
  g.addColorStop(0.78, '#5a6a94');
  g.addColorStop(1, '#9a8fa0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, Math.max(1, horizon));

  const yawOff = (PLAYER.ang / TAU) * W * 1.6;

  // stars
  for (const st of STARS) {
    let x = ((st.x * W - yawOff) % W + W) % W;
    const y = st.y * Math.max(1, horizon) * 0.78;
    if (y > horizon - 4) continue;
    ctx.globalAlpha = st.a * clamp(1 - y / Math.max(1, horizon), 0.25, 1);
    ctx.fillStyle = '#cfe4ff';
    ctx.fillRect(x, y, st.r, st.r);
  }
  ctx.globalAlpha = 1;

  // far skyline
  const skyOff = (PLAYER.ang / TAU) * W * 0.55;
  ctx.fillStyle = '#0d1430';
  for (const t of TOWERS) {
    const bw = (t.w / 220) * W;
    let x = ((t.i / 220) * W - skyOff) % W;
    if (x < -bw) x += W;
    const bh = t.h * H;
    ctx.fillRect(x, horizon - bh, bw + 1, bh + 1);
  }

  // near skyline silhouette (jagged rooftops)
  ctx.fillStyle = '#080d1e';
  const segW = W / SKYLINE.length;
  for (let i = 0; i < SKYLINE.length; i++) {
    const hh = SKYLINE[i] * H;
    let x = (i * segW - skyOff * 1.35) % W;
    if (x < -segW) x += W;
    ctx.fillRect(x, horizon - hh, segW + 1, hh + 1);
  }

  // haze on the horizon
  const haze = ctx.createLinearGradient(0, horizon - H * 0.10, 0, horizon + 2);
  haze.addColorStop(0, 'rgba(90,130,220,0)');
  haze.addColorStop(1, 'rgba(90,130,220,0.30)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, horizon - H * 0.10, W, H * 0.10 + 2);
}

function projectGround(x, y) {
  const p = PLAYER;
  const dirX = Math.cos(p.ang), dirY = Math.sin(p.ang);
  const tanHalf = Math.tan(FOV_ACTIVE / 2);
  const planeX = -dirY * tanHalf;
  const planeY = dirX * tanHalf;
  const relX = x - p.x, relY = y - p.y;
  const det = planeX * dirY - dirX * planeY;
  const invDet = 1 / (det || 1e-9);
  const tx = invDet * (dirY * relX - dirX * relY);
  const ty = invDet * (-planeY * relX + planeX * relY);
  if (ty <= 0.15) return null;
  return { sx: (W / 2) * (1 + tx / ty), sy: horizon + projPlane * PLAYER.camZ / ty, d: ty };
}

function groundLine(x1, y1, x2, y2, color, width) {
  const N = 18;
  let started = false;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const pr = projectGround(lerp(x1, x2, t), lerp(y1, y2, t));
    if (!pr || pr.d > 52) { started = false; continue; }
    if (!started) { ctx.moveTo(pr.sx, pr.sy); started = true; }
    else ctx.lineTo(pr.sx, pr.sy);
  }
  ctx.stroke();
}

function drawGround() {
  if (horizon >= H) return;

  const style = mapStyle();
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  const fl = style.floor || '#3c4046';
  g.addColorStop(0, shadeHex(fl, 1.35));
  g.addColorStop(0.35, shadeHex(fl, 1.0));
  g.addColorStop(1, shadeHex(fl, 0.7));
  ctx.fillStyle = g;
  ctx.fillRect(0, Math.max(0, horizon), W, H - Math.max(0, horizon));

  // perspective grid — road maps get lane markings instead
  const step = style.road ? 4 : 5;
  const range = 46;
  const seen = 6;
  const bx = Math.floor(PLAYER.x / step) * step;
  const by = Math.floor(PLAYER.y / step) * step;
  const gridRGB = style.road ? '240,200,80' : (indoorMode ? '240,200,150' : '150,195,255');
  const baseAlpha = style.road ? 0.22 : (indoorMode ? 0.07 : 0.13);

  ctx.save();
  for (let k = -seen; k <= seen; k++) {
    const fade = baseAlpha - Math.abs(k) * 0.010;
    groundLine(bx - range, by + k * step, bx + range, by + k * step, 'rgba(' + gridRGB + ',' + fade.toFixed(3) + ')', style.road ? 2 : 1);
    groundLine(bx + k * step, by - range, bx + k * step, by + range, 'rgba(' + gridRGB + ',' + fade.toFixed(3) + ')', 1);
  }
  ctx.restore();
}


function renderWorld() {
  const p = PLAYER;
  FOV_ACTIVE = lerp(FOV, 0.70, p.ads);
  const dirX = Math.cos(p.ang), dirY = Math.sin(p.ang);
  const tanHalf = Math.tan(FOV_ACTIVE / 2);
  const planeX = -dirY * tanHalf;
  const planeY = dirX * tanHalf;

  projPlane = (W / 2) / tanHalf;
  horizon = H / 2 + p.pitch + Math.sin(p.bob * 2) * 2 + (p.slideT > 0 ? 6 : 0);

  const cz = p.camZ;
  const wallH = mapStyle().height || 1;

  drawSky();
  drawGround();

  COLW = W > 1400 ? 3 : 2;
  COLS = Math.ceil(W / COLW);
  zbuf = new Array(COLS);

  for (let i = 0; i < COLS; i++) {
    const cameraX = 2 * (i + 0.5) / COLS - 1;
    const rdx = dirX + planeX * cameraX;
    const rdy = dirY + planeY * cameraX;

    let mapX = Math.floor(p.x);
    let mapY = Math.floor(p.y);
    const deltaX = Math.abs(1 / (rdx || 1e-9));
    const deltaY = Math.abs(1 / (rdy || 1e-9));

    let stepX, stepY, sideDistX, sideDistY;
    if (rdx < 0) { stepX = -1; sideDistX = (p.x - mapX) * deltaX; }
    else { stepX = 1; sideDistX = (mapX + 1 - p.x) * deltaX; }
    if (rdy < 0) { stepY = -1; sideDistY = (p.y - mapY) * deltaY; }
    else { stepY = 1; sideDistY = (mapY + 1 - p.y) * deltaY; }

    let hit = 0, side = 0, guard = 0;
    while (!hit && guard++ < 80) {
      if (sideDistX < sideDistY) { sideDistX += deltaX; mapX += stepX; side = 0; }
      else { sideDistY += deltaY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= MW || mapY >= MH) { hit = 1; break; }
      if (solidAt(mapX, mapY)) hit = 1;
    }

    const perp = Math.max(0.05, side === 0
      ? (mapX - p.x + (1 - stepX) / 2) / (rdx || 1e-9)
      : (mapY - p.y + (1 - stepY) / 2) / (rdy || 1e-9));

    zbuf[i] = perp;

    const lineH = projPlane / perp;
    const top = horizon + projPlane * (cz - wallH) / perp;
    const bottom = horizon + projPlane * cz / perp;

    // flashlight falloff: bright ahead, swallowed at the edges
    const cone = 1 - 0.42 * Math.pow(Math.abs(cameraX), 1.5);
    // vertical mortar seams give the walls texture
    const wallX = side === 0 ? (p.y + perp * rdy) : (p.x + perp * rdx);
    const seam = Math.abs((wallX * 3) % 1 - 0.5) < 0.045 ? 0.88 : 1;
    const fog = clamp((1.75 - perp * 0.028) * cone * seam, 0.30, 1.25);
    const dr = doorAt(mapX, mapY);

    if (dr) {
      // door panel slides up into the wall
      const ph = Math.max(1, (bottom - top) * (1 - dr.open));
      ctx.fillStyle = shadeHex(doorColour(), fog);
      ctx.fillRect(i * COLW, top, COLW, ph);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(i * COLW, top + ph - Math.max(2, (bottom - top) * 0.03), COLW, Math.max(2, (bottom - top) * 0.03));
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(i * COLW, top, COLW, Math.max(1, (bottom - top) * 0.02));
    } else {
      ctx.fillStyle = shadeHex(wallColor(mapX, mapY, side), fog);
      ctx.fillRect(i * COLW, top, COLW, Math.max(1, bottom - top));
    }

    // floor edge line for depth
    if (perp < 9) {
      ctx.fillStyle = 'rgba(190,225,255,' + (0.16 * fog).toFixed(3) + ')';
      ctx.fillRect(i * COLW, bottom - 2, COLW, 2);
    }
  }
}

function projectPoint(x, y) {
  // returns {sx, dist, scale} in screen space
  const p = PLAYER;
  const dirX = Math.cos(p.ang), dirY = Math.sin(p.ang);
  const tanHalf = Math.tan(FOV_ACTIVE / 2);
  const planeX = -dirY * tanHalf;
  const planeY = dirX * tanHalf;
  const relX = x - p.x, relY = y - p.y;
  const det = planeX * dirY - dirX * planeY;
  const invDet = 1 / (det || 1e-9);
  const tx = invDet * (dirY * relX - dirX * relY);
  const ty = invDet * (-planeY * relX + planeX * relY);
  if (ty <= 0.05) return null;
  const sx = (W / 2) * (1 + tx / ty);
  return { sx, dist: ty, scale: projPlane / ty };
}

function drawZombie(b) {
  const pr = projectPoint(b.x, b.y);
  if (!pr) return;
  const dist = pr.dist;
  if (dist > 36) return;

  const hPix = pr.scale * b.height;
  const wPix = pr.scale * b.width;
  const bottom = horizon + projPlane * PLAYER.camZ / dist;
  const top = bottom - hPix;
  if (bottom < -hPix * 2 || top > H + hPix) return;

  const left = pr.sx - wPix;
  const right = pr.sx + wPix;
  if (right < 0 || left > W) return;

  // visible column runs (wall occlusion)
  const c0 = Math.max(0, Math.floor(left / COLW));
  const c1 = Math.min(COLS - 1, Math.floor(right / COLW));
  const runs = [];
  let runStart = -1;
  for (let c = c0; c <= c1; c++) {
    const vis = zbuf[c] >= dist - 0.05;
    if (vis && runStart < 0) runStart = c;
    if ((!vis || c === c1) && runStart >= 0) {
      runs.push([runStart, vis ? c : c - 1]);
      runStart = -1;
    }
  }
  if (!runs.length) return;

  ctx.save();
  ctx.beginPath();
  for (const [a, bb] of runs) {
    if (bb < a) continue;
    ctx.rect(a * COLW, 0, (bb - a + 1) * COLW, H);
  }
  ctx.clip();

  const cx = pr.sx;
  const dead = !b.alive;
  // fast topple with a soft settle, then a slower fade
  const dk = dead ? clamp(b.deathT / 0.5, 0, 1) : 0;
  const fall = dead ? (1 - Math.pow(1 - dk, 2.2)) : 0;
  const alpha = dead ? clamp(1 - Math.max(0, (b.deathT - 0.75) / 0.55), 0, 1) : 1;
  if (alpha <= 0.02) { ctx.restore(); return; }

  // blood pool spreading under the body
  if (dead && b.deathT > 0.08) {
    const grow = clamp((b.deathT - 0.08) / 0.55, 0, 1);
    ctx.globalAlpha = alpha * 0.6 * grow;
    ctx.fillStyle = '#3d0a10';
    ctx.beginPath();
    ctx.ellipse(cx, bottom + hPix * 0.012, wPix * 0.62 * grow, hPix * 0.055 * grow, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = alpha;
  }

  // ground shadow
  ctx.globalAlpha = 0.4 * alpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, bottom, wPix * 0.5, hPix * 0.035, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = alpha;

  const kick = b.hitKick || 0;
  ctx.translate(cx + kick * wPix * 0.07, bottom + fall * hPix * 0.05);
  if (fall > 0) {
    // a tiny bounce as it hits the floor
    const bounce = Math.sin(Math.min(1, b.deathT / 0.5) * Math.PI * 2) * 0.05 * (1 - fall);
    ctx.rotate(fall * 1.55 + bounce);
  }

  const h = hPix, w = wPix;
  const walk = Math.sin(b.phase);
  const walk2 = Math.sin(b.phase + 1.3);
  const attack = b.windupT > 0 ? 1 - (b.windupT / b.windup) : 0;

  const hurt = b.hitFlash > 0.45;
  const skin = hurt ? '#ffffff' : b.skin;
  const skinDark = hurt ? '#ffe0e0' : b.skinDark;
  const shirt = hurt ? '#ffffff' : b.shirt;
  const pants = hurt ? '#ffffff' : b.pants;

  const hipY = -h * 0.42;
  const shY = -h * 0.76;
  const shW = w * 0.46;
  const hipW = w * 0.36;

  // ---- legs (dragging, uneven gait)
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2, w * 0.17);
  const stride = walk * w * 0.11;
  ctx.strokeStyle = pants;
  ctx.beginPath();
  ctx.moveTo(-w * 0.05, hipY);
  ctx.lineTo(-w * 0.11 - stride * 0.5, -h * 0.19);
  ctx.lineTo(-w * 0.15 - stride, -h * 0.01);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.05, hipY);
  ctx.lineTo(w * 0.11 + stride * 0.5, -h * 0.19);
  ctx.lineTo(w * 0.14 + stride * 0.8, -h * 0.01);
  ctx.stroke();

  // ---- arms behind the torso (reaching forward)
  const armRaise = attack;
  const handY = lerp(hipY - h * 0.06, shY + h * 0.06, armRaise);
  const handX = lerp(w * 0.40, w * 0.50, armRaise);
  ctx.strokeStyle = skinDark;
  ctx.lineWidth = Math.max(2, w * 0.12);
  ctx.beginPath();
  ctx.moveTo(-shW * 0.40, shY + h * 0.05);
  ctx.quadraticCurveTo(-shW * 0.95, shY + h * 0.16 + walk2 * h * 0.01, -handX, handY + h * 0.04);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(shW * 0.40, shY + h * 0.05);
  ctx.quadraticCurveTo(shW * 0.95, shY + h * 0.16 - walk2 * h * 0.01, handX, handY + h * 0.03);
  ctx.stroke();
  // hands
  ctx.fillStyle = skinDark;
  ctx.beginPath();
  ctx.arc(-handX, handY + h * 0.05, Math.max(1.5, w * 0.045), 0, TAU);
  ctx.arc(handX, handY + h * 0.04, Math.max(1.5, w * 0.045), 0, TAU);
  ctx.fill();

  // ---- torso (hunched)
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(-hipW / 2, hipY + h * 0.02);
  ctx.lineTo(-shW / 2, shY);
  ctx.quadraticCurveTo(0, shY - h * 0.045, shW / 2, shY);
  ctx.lineTo(hipW / 2, hipY + h * 0.02);
  ctx.closePath();
  ctx.fill();

  // torn shirt hem
  ctx.fillStyle = shirt;
  for (let i = -2; i <= 2; i++) {
    const tx = (i / 2) * hipW * 0.45;
    const len = (0.03 + ((i * 7919) % 5) * 0.006) * h;
    ctx.beginPath();
    ctx.moveTo(tx - w * 0.03, hipY + h * 0.01);
    ctx.lineTo(tx + w * 0.03, hipY + h * 0.01);
    ctx.lineTo(tx, hipY + h * 0.01 + len);
    ctx.closePath();
    ctx.fill();
  }

  // filth / blood on the chest
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = '#43131a';
  ctx.beginPath();
  ctx.ellipse(-w * 0.08, shY + h * 0.09, w * 0.10, h * 0.05, 0.3, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w * 0.11, shY + h * 0.18, w * 0.07, h * 0.035, -0.4, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = alpha;

  // collarbone / sunken chest shading
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = Math.max(1, w * 0.03);
  ctx.beginPath();
  ctx.moveTo(-shW * 0.22, shY + h * 0.05);
  ctx.quadraticCurveTo(0, shY + h * 0.11, shW * 0.22, shY + h * 0.05);
  ctx.stroke();

  // rim light down the left edge — reads as a body in the dark
  ctx.strokeStyle = 'rgba(190,215,255,0.20)';
  ctx.lineWidth = Math.max(1, w * 0.035);
  ctx.beginPath();
  ctx.moveTo(-shW * 0.5, shY + h * 0.02);
  ctx.quadraticCurveTo(-shW * 0.6, shY + h * 0.16, -hipW * 0.48, hipY);
  ctx.stroke();

  // blood running down the chest
  ctx.fillStyle = 'rgba(112,12,18,0.7)';
  for (let bi = 0; bi < 3; bi++) {
    const bx = -w * 0.09 + bi * w * 0.10;
    const bl = h * (0.045 + (bi % 2) * 0.03);
    ctx.fillRect(bx, shY + h * 0.13, Math.max(1, w * 0.02), bl);
    ctx.beginPath();
    ctx.arc(bx + Math.max(1, w * 0.01), shY + h * 0.13 + bl, Math.max(1, w * 0.012), 0, TAU);
    ctx.fill();
  }

  // ---- head (tilted)
  ctx.save();
  ctx.translate(w * 0.02, shY - h * 0.062);
  ctx.rotate(0.14 - walk * 0.06);
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(0, 0, h * 0.072, h * 0.088, 0, 0, TAU);
  ctx.fill();

  // jaw / gaunt cheeks
  ctx.fillStyle = skinDark;
  ctx.beginPath();
  ctx.ellipse(0, h * 0.052, h * 0.048, h * 0.032, 0, 0, TAU);
  ctx.fill();

  // eye sockets
  ctx.fillStyle = '#100c0c';
  ctx.beginPath();
  ctx.ellipse(-h * 0.028, -h * 0.012, h * 0.017, h * 0.013, 0.2, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(h * 0.030, -h * 0.010, h * 0.017, h * 0.013, -0.2, 0, TAU);
  ctx.fill();

  // faint eye glint (so they read in the dark)
  if (dist < 22) {
    ctx.fillStyle = b.eyes;
    ctx.globalAlpha = alpha * 0.35;
    ctx.beginPath();
    ctx.arc(-h * 0.028, -h * 0.012, h * 0.006, 0, TAU);
    ctx.arc(h * 0.030, -h * 0.010, h * 0.006, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = alpha;
  }

  // open mouth + blood
  ctx.fillStyle = '#240a0d';
  ctx.beginPath();
  ctx.ellipse(0, h * 0.044, h * 0.020, h * 0.017, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,18,24,0.85)';
  ctx.fillRect(-h * 0.004, h * 0.052, h * 0.008, h * 0.045);

  // matted hair
  ctx.fillStyle = 'rgba(30,22,18,0.75)';
  ctx.beginPath();
  ctx.ellipse(0, -h * 0.045, h * 0.068, h * 0.045, 0, Math.PI, TAU);
  ctx.fill();

  ctx.restore();

  // attack tell: a quick dark-red swipe
  if (attack > 0.55) {
    ctx.globalAlpha = alpha * (attack - 0.55) * 1.6;
    ctx.strokeStyle = '#c8202f';
    ctx.lineWidth = Math.max(2, w * 0.07);
    ctx.beginPath();
    ctx.arc(0, shY + h * 0.12, w * 0.55, -0.9, 0.9);
    ctx.stroke();
    ctx.globalAlpha = alpha;
  }

  ctx.restore();

  if (dead) return;

  // health bar
  if (b.hp < b.maxHp) {
    const bw = wPix * 0.85;
    const by = top + hPix * 0.03;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(cx - bw / 2, by, bw, Math.max(2, hPix * 0.016));
    ctx.fillStyle = b.type === 'brute' ? '#ff8b4a' : '#c8202f';
    ctx.fillRect(cx - bw / 2, by, bw * clamp(b.hp / b.maxHp, 0, 1), Math.max(2, hPix * 0.016));
    ctx.restore();
  }

  // type tag up close
  if (dist < 16) {
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - dist / 16, 0, 0.7);
    ctx.font = '700 ' + Math.round(clamp(wPix * 0.19, 9, 12)) + 'px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d8e0b8';
    ctx.fillText(b.name, cx, top - 6);
    ctx.restore();
  }
}

function drawAcids() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const a of acids) {
    const pr = projectPoint(a.x, a.y);
    if (!pr) continue;
    const sy = horizon + projPlane * (PLAYER.camZ - a.z) / pr.dist;
    const r = Math.max(2, pr.scale * 0.17);
    ctx.fillStyle = '#8fff4a';
    ctx.shadowColor = '#39ff14';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(pr.sx, sy, r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawSpecials() {
  if (state !== 'play') return;

  if (phase === 'find' && hatch) {
    const pr = projectPoint(hatch.x, hatch.y);
    if (pr && pr.dist < 40) {
      const gy = horizon + projPlane * PLAYER.camZ / pr.dist;
      const w = pr.scale * 0.55;
      const pulse = 0.55 + Math.sin(tNow * 3) * 0.45;

      // light column so it can be spotted
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const colH = pr.scale * 1.6;
      const lg = ctx.createLinearGradient(0, gy - colH, 0, gy);
      lg.addColorStop(0, 'rgba(90,255,180,0)');
      lg.addColorStop(1, 'rgba(90,255,180,' + (0.20 + pulse * 0.12).toFixed(3) + ')');
      ctx.fillStyle = lg;
      ctx.fillRect(pr.sx - w * 0.5, gy - colH, w, colH);
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(120,255,190,' + (0.45 + pulse * 0.45).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1.5, pr.scale * 0.035);
      ctx.beginPath();
      ctx.ellipse(pr.sx, gy, w, w * 0.34, 0, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'rgba(60,255,170,0.10)';
      ctx.fill();
      ctx.restore();

      if (pr.dist < 14) {
        ctx.save();
        ctx.globalAlpha = clamp(1.5 - pr.dist / 14, 0, 0.85);
        ctx.textAlign = 'center';
        ctx.font = '700 11px ui-monospace, monospace';
        ctx.fillStyle = '#8dffb0';
        ctx.fillText('BUNKER HATCH', pr.sx, gy - 14);
        ctx.restore();
      }
    }
  }

  if (phase === 'switch' && mapSpecials.key) {
    const k = mapSpecials.key;
    const pr = projectPoint(k.x, k.y);
    if (pr && pr.dist < 40) {
      const sy = horizon + projPlane * (PLAYER.camZ - 1.05) / pr.dist;
      const s = pr.scale;
      const pulse = 0.5 + Math.sin(tNow * 4) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,210,90,' + (0.55 + pulse * 0.35).toFixed(3) + ')';
      ctx.shadowColor = '#ffd34d';
      ctx.shadowBlur = 24;
      ctx.fillRect(pr.sx - s * 0.18, sy - s * 0.22, s * 0.36, s * 0.44);
      ctx.restore();
      // bolt
      ctx.save();
      ctx.fillStyle = '#101418';
      ctx.beginPath();
      ctx.moveTo(pr.sx + s * 0.04, sy - s * 0.16);
      ctx.lineTo(pr.sx - s * 0.06, sy + s * 0.02);
      ctx.lineTo(pr.sx + s * 0.01, sy + s * 0.02);
      ctx.lineTo(pr.sx - s * 0.03, sy + s * 0.16);
      ctx.lineTo(pr.sx + s * 0.07, sy - s * 0.03);
      ctx.lineTo(pr.sx, sy - s * 0.03);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  if (phase === 'escape' && mapSpecials.exit) {
    const x = mapSpecials.exit;
    const pr = projectPoint(x.x, x.y);
    if (pr && pr.dist < 46) {
      const gy = horizon + projPlane * PLAYER.camZ / pr.dist;
      const h = pr.scale * 1.9;
      const w = pr.scale * 0.75;
      const pulse = 0.55 + Math.sin(tNow * 3.4) * 0.45;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createLinearGradient(0, gy - h, 0, gy);
      eg.addColorStop(0, 'rgba(90,255,160,' + (0.30 + pulse * 0.2).toFixed(3) + ')');
      eg.addColorStop(1, 'rgba(90,255,160,0.05)');
      ctx.fillStyle = eg;
      ctx.fillRect(pr.sx - w / 2, gy - h, w, h);
      ctx.strokeStyle = 'rgba(150,255,200,' + (0.6 + pulse * 0.3).toFixed(3) + ')';
      ctx.lineWidth = Math.max(2, pr.scale * 0.04);
      ctx.strokeRect(pr.sx - w / 2, gy - h, w, h);
      ctx.restore();

      if (pr.dist < 18) {
        ctx.save();
        ctx.globalAlpha = clamp(1.6 - pr.dist / 18, 0, 0.9);
        ctx.textAlign = 'center';
        ctx.font = '800 12px ui-monospace, monospace';
        ctx.fillStyle = '#9dffd0';
        ctx.fillText('EXIT', pr.sx, gy - h - 8);
        ctx.restore();
      }
    }
  }
}

function wrapText(text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '';
  let yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = w;
      yy += lh;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
}

function drawProjectiles() {
  for (const p of projectiles) {
    const pr = projectPoint(p.x, p.y);
    if (!pr) continue;
    const bottom = horizon + projPlane * (PLAYER.camZ - p.z) / pr.dist;
    const r = Math.max(2, pr.scale * p.size);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(pr.sx, bottom, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawTracers() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const t of tracers) {
    const a = projectPoint(t.x1, t.y1);
    const b = projectPoint(t.x2, t.y2);
    if (!a || !b) continue;
    const ay = horizon + projPlane * (PLAYER.camZ - 0.5) / a.dist;
    const by = horizon + projPlane * (PLAYER.camZ - 0.5) / b.dist;
    ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(a.sx, ay);
    ctx.lineTo(b.sx, by);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const pr = projectPoint(f.x, f.y);
    if (!pr) continue;
    const sy = horizon - projPlane * 0.35 / pr.dist;
    ctx.globalAlpha = clamp(f.life / 1.2, 0, 1);
    ctx.font = '800 ' + Math.round(clamp(pr.scale * 0.16, 11, 26)) + 'px ui-monospace, monospace';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, pr.sx, sy);
  }
  ctx.restore();
}

function drawParticles3D() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const pr = projectPoint(p.x, p.y);
    if (!pr) continue;
    const sy = horizon + projPlane * (PLAYER.camZ - p.z) / pr.dist;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(pr.sx, sy, Math.max(1, pr.scale * p.size), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function metal(x, y, w, h, r, light) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, light ? '#5c6678' : '#414a5a');
  g.addColorStop(0.45, '#252b36');
  g.addColorStop(1, '#0e1116');
  ctx.fillStyle = g;
  rr(x, y, w, h, r === undefined ? 3 : r);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function polymer(x, y, w, h, r) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#333a46');
  g.addColorStop(1, '#161a21');
  ctx.fillStyle = g;
  rr(x, y, w, h, r === undefined ? 3 : r);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawPistolModel(w, s) {
  const rev = w.id === 'revolver';
  ctx.save();
  ctx.rotate(-0.03);
  // slide / frame
  metal(-118 * s, -104 * s, 122 * s, 34 * s, 4 * s);
  // barrel
  if (rev) {
    ctx.fillStyle = '#14171d';
    rr(-186 * s, -98 * s, 76 * s, 22 * s, 4 * s);
    ctx.fill();
    // cylinder
    ctx.fillStyle = '#2b323d';
    ctx.beginPath();
    ctx.arc(-96 * s, -84 * s, 22 * s, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#14171d';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.beginPath();
      ctx.arc(-96 * s + Math.cos(a) * 12 * s, -84 * s + Math.sin(a) * 12 * s, 3.5 * s, 0, TAU);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = '#14171d';
    rr(-146 * s, -98 * s, 34 * s, 20 * s, 3 * s);
    ctx.fill();
  }
  // grip
  ctx.save();
  ctx.translate(-2 * s, -74 * s);
  ctx.rotate(-0.30);
  polymer(-13 * s, 0, 27 * s, 60 * s, 6 * s);
  ctx.restore();
  // trigger guard
  ctx.strokeStyle = '#1b1f26';
  ctx.lineWidth = 4 * s;
  ctx.beginPath();
  ctx.arc(-34 * s, -66 * s, 14 * s, 0.1, Math.PI - 0.1);
  ctx.stroke();
  // sights
  ctx.fillStyle = '#2b313c';
  rr(-112 * s, -114 * s, 8 * s, 12 * s, 2 * s);
  ctx.fill();
  rr(-14 * s, -114 * s, 8 * s, 12 * s, 2 * s);
  ctx.fill();
  ctx.restore();

  handAt(s, 0, -54 * s);
  return { mx: rev ? -190 * s : -150 * s, my: -90 * s };
}

function drawLauncherModel(w, s) {
  ctx.save();
  ctx.rotate(-0.05);
  // tube
  const tube = ctx.createLinearGradient(-300 * s, -100 * s, -300 * s, -40 * s);
  tube.addColorStop(0, '#3c4a3f');
  tube.addColorStop(1, '#16201a');
  ctx.fillStyle = tube;
  rr(-300 * s, -104 * s, 250 * s, 56 * s, 12 * s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // muzzle ring
  ctx.fillStyle = '#0e1410';
  ctx.beginPath();
  ctx.ellipse(-298 * s, -76 * s, 12 * s, 26 * s, 0, 0, TAU);
  ctx.fill();
  // drum
  ctx.fillStyle = '#25332a';
  ctx.beginPath();
  ctx.arc(-120 * s, -40 * s, 34 * s, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#0e1410';
  ctx.lineWidth = 3 * s;
  ctx.stroke();
  // warhead visible in tube
  if (w.id === 'rocket') {
    ctx.fillStyle = '#c8b45a';
    ctx.beginPath();
    ctx.moveTo(-286 * s, -96 * s);
    ctx.lineTo(-256 * s, -76 * s);
    ctx.lineTo(-286 * s, -56 * s);
    ctx.closePath();
    ctx.fill();
  }
  // grip + trigger
  ctx.save();
  ctx.translate(-8 * s, -56 * s);
  ctx.rotate(-0.16);
  polymer(-13 * s, 0, 26 * s, 58 * s, 6 * s);
  ctx.restore();
  // optic
  ctx.fillStyle = '#1a201c';
  rr(-140 * s, -128 * s, 54 * s, 22 * s, 5 * s);
  ctx.fill();
  ctx.restore();

  handAt(s, -6 * s, -44 * s);
  return { mx: -300 * s, my: -76 * s };
}

function drawKnifeModel(w, s) {
  const axe = w.id === 'axe';
  ctx.save();
  ctx.rotate(-0.02);
  if (axe) {
    // haft
    const wood = ctx.createLinearGradient(0, -200 * s, 0, 0);
    wood.addColorStop(0, '#6b4a33');
    wood.addColorStop(1, '#33221a');
    ctx.fillStyle = wood;
    rr(-14 * s, -230 * s, 26 * s, 230 * s, 8 * s);
    ctx.fill();
    // head
    const steel = ctx.createLinearGradient(-80 * s, -250 * s, 20 * s, -180 * s);
    steel.addColorStop(0, '#cfd8e6');
    steel.addColorStop(1, '#6d7889');
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.moveTo(-6 * s, -232 * s);
    ctx.lineTo(-84 * s, -216 * s);
    ctx.quadraticCurveTo(-104 * s, -186 * s, -70 * s, -168 * s);
    ctx.lineTo(-6 * s, -176 * s);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,40,55,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    // blade
    const steel = ctx.createLinearGradient(-30 * s, -230 * s, 30 * s, -60 * s);
    steel.addColorStop(0, '#e2ecf7');
    steel.addColorStop(0.5, '#aab8ca');
    steel.addColorStop(1, '#5a6577');
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.moveTo(-8 * s, -70 * s);
    ctx.lineTo(-30 * s, -190 * s);
    ctx.lineTo(-18 * s, -236 * s);
    ctx.lineTo(2 * s, -190 * s);
    ctx.lineTo(6 * s, -70 * s);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,40,55,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // fuller
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(-8 * s, -196 * s);
    ctx.lineTo(-4 * s, -84 * s);
    ctx.stroke();
    // guard
    ctx.fillStyle = '#2a3345';
    rr(-30 * s, -78 * s, 62 * s, 12 * s, 4 * s);
    ctx.fill();
  }
  // grip wrap
  ctx.fillStyle = '#1d232c';
  rr(-16 * s, -70 * s, 30 * s, 60 * s, 6 * s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,140,170,0.35)';
  ctx.lineWidth = 1.5 * s;
  for (let i = 0; i < 5; i++) {
    const yy = -66 * s + i * 11 * s;
    ctx.beginPath();
    ctx.moveTo(-14 * s, yy);
    ctx.lineTo(12 * s, yy - 4 * s);
    ctx.stroke();
  }
  ctx.restore();

  handAt(s, 0, -30 * s);
  return null;
}

function drawViewmodel() {
  const w = currentWeapon();
  if (!w) return;

  const s = Math.min(W, H) / 745;
  const ads = PLAYER.ads;
  const bobX = Math.sin(PLAYER.bob * 2) * 5 * (1 - ads * 0.75);
  const bobY = Math.abs(Math.cos(PLAYER.bob * 2)) * 4 * (1 - ads * 0.75);
  const kick = PLAYER.kick * 18 * (1 - ads * 0.35);
  const reloadDur = w.reload || 1;
  const reload = PLAYER.reloadT > 0
    ? Math.sin(clamp(1 - PLAYER.reloadT / reloadDur, 0, 1) * Math.PI)
    : 0;
  const recoil = PLAYER.recoil;

  const swayX = PLAYER.swayX * (1 - ads * 0.6);
  const swayY = PLAYER.swayY * (1 - ads * 0.6);
  const drawDrop = PLAYER.drawT * 110 * s;

  const baseX = lerp(W * 0.60, W * 0.545, ads) + bobX + swayX;
  const baseY = lerp(H + 30, H * 1.02, ads) + bobY + swayY + kick * 0.55 + reload * 86 + drawDrop;

  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(-0.17 + recoil * 0.016 * (1 - ads * 0.5) + PLAYER.drawT * 0.12);

  let muzzle = null;
  if (w.melee) {
    if (PLAYER.slash > 0) {
      const t = 1 - PLAYER.slash;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(200,240,255,' + (PLAYER.slash * 0.7).toFixed(3) + ')';
      ctx.lineWidth = 7 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -120 * s, 140 * s, -Math.PI * 0.85 + t * 1.9, -Math.PI * 0.30 + t * 1.9);
      ctx.stroke();
      ctx.restore();
    }
    drawKnifeModel(w, s);
  } else if (w.projectile) muzzle = drawLauncherModel(w, s);
  else if (w.id === 'shotgun') muzzle = drawShotgunModel(s);
  else if (w.id === 'dmr') muzzle = drawDmrModel(s);
  else if (w.id === 'pistol' || w.id === 'revolver') muzzle = drawPistolModel(w, s);
  else if (w.id === 'smg') muzzle = drawSmgModel(s);
  else muzzle = drawRifleModel(s);

  // muzzle flash at the real barrel end
  if (muzzle && PLAYER.kick > 0.5) {
    const fw = (0.7 + Math.random() * 0.5) * 42 * s;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(muzzle.mx, muzzle.my, 0, muzzle.mx, muzzle.my, fw);
    g.addColorStop(0, 'rgba(255,248,210,0.95)');
    g.addColorStop(0.4, 'rgba(255,190,90,0.65)');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(muzzle.mx, muzzle.my, fw, 0, TAU);
    ctx.fill();
    // star spikes
    ctx.strokeStyle = 'rgba(255,235,170,0.85)';
    ctx.lineWidth = 2.5 * s;
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * TAU;
      const len = fw * (0.6 + Math.random() * 0.8);
      ctx.beginPath();
      ctx.moveTo(muzzle.mx, muzzle.my);
      ctx.lineTo(muzzle.mx + Math.cos(a) * len, muzzle.my + Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawCrosshair() {
  const cx = W / 2, cy = H / 2 + PLAYER.pitch * 0;
  const spread = (6 + PLAYER.recoil * 14) * (1 - PLAYER.ads * 0.55);
  ctx.save();
  ctx.strokeStyle = 'rgba(180,235,255,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - spread - 8, cy); ctx.lineTo(cx - spread, cy);
  ctx.moveTo(cx + spread, cy); ctx.lineTo(cx + spread + 8, cy);
  ctx.moveTo(cx, cy - spread - 8); ctx.lineTo(cx, cy - spread);
  ctx.moveTo(cx, cy + spread); ctx.lineTo(cx, cy + spread + 8);
  ctx.stroke();
  ctx.fillStyle = 'rgba(180,235,255,0.9)';
  ctx.beginPath();
  ctx.arc(cx, cy, 1.6, 0, TAU);
  ctx.fill();

  if (PLAYER.hitFlash > 0) {
    ctx.strokeStyle = 'rgba(255,230,120,' + PLAYER.hitFlash.toFixed(2) + ')';
    ctx.lineWidth = 2.5;
    const d = 12;
    ctx.beginPath();
    ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx - d + 6, cy - d + 6);
    ctx.moveTo(cx + d, cy - d); ctx.lineTo(cx + d - 6, cy - d + 6);
    ctx.moveTo(cx - d, cy + d); ctx.lineTo(cx - d + 6, cy + d - 6);
    ctx.moveTo(cx + d, cy + d); ctx.lineTo(cx + d - 6, cy + d - 6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMinimap() {
  const size = Math.min(150, W * 0.16);
  const px = W - size - 24;
  const py = 74;
  const cell = size / Math.max(MW, MH);

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(8,12,24,0.8)';
  ctx.fillRect(px - 6, py - 6, size + 12, size + 12);
  ctx.strokeStyle = 'rgba(120,170,255,0.25)';
  ctx.strokeRect(px - 6.5, py - 6.5, size + 13, size + 13);

  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (map[y][x] === 1) {
        ctx.fillStyle = 'rgba(110,150,230,0.35)';
        ctx.fillRect(px + x * cell, py + y * cell, cell, cell);
      }
    }
  }

  for (const b of bots) {
    if (!b.alive) continue;
    ctx.fillStyle = '#ff5b7f';
    ctx.beginPath();
    ctx.arc(px + b.x * cell, py + b.y * cell, Math.max(1.8, cell * 0.35), 0, TAU);
    ctx.fill();
  }

  // player arrow
  const ax = px + PLAYER.x * cell;
  const ay = py + PLAYER.y * cell;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(PLAYER.ang);
  ctx.fillStyle = '#9dffd0';
  ctx.beginPath();
  ctx.moveTo(5, 0);
  ctx.lineTo(-3, 3);
  ctx.lineTo(-3, -3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawHUD() {
  if (state === 'menu') return;

  ctx.save();
  ctx.textBaseline = 'top';

  // health
  const hpW = 210;
  ctx.font = '700 9px ui-monospace, monospace';
  ctx.fillStyle = currentClass().color;
  ctx.fillText(currentClass().name, 24, H - 96);

  ctx.fillStyle = 'rgba(8,12,24,0.7)';
  ctx.fillRect(24, H - 84, hpW, 56);
  ctx.fillStyle = PLAYER.hp > 35 ? 'rgba(90,230,160,0.9)' : 'rgba(255,90,110,0.95)';
  ctx.fillRect(24, H - 84, hpW * clamp(PLAYER.hp / Math.max(1, PLAYER.maxHp), 0, 1), 6);
  ctx.font = '800 30px ui-monospace, monospace';
  ctx.fillStyle = '#eaf6ff';
  ctx.fillText(String(Math.ceil(PLAYER.hp)), 32, H - 72);
  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,185,235,0.6)';
  ctx.fillText('HP', 24 + hpW - 26, H - 66);

  // ammo + weapon
  const w = currentWeapon();
  if (w) {
    ctx.textAlign = 'right';
    ctx.font = '800 34px ui-monospace, monospace';
    ctx.fillStyle = PLAYER.reloadT > 0 ? 'rgba(255,190,90,0.9)' : '#eaf6ff';
    ctx.fillText(w.melee ? '∞' : String(PLAYER.ammo[PLAYER.slot]), W - 28, H - 96);
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.6)';
    ctx.fillText(PLAYER.reloadT > 0 ? 'RELOADING...' : w.name, W - 28, H - 56);

    // slots
    ctx.textAlign = 'center';
    for (let i = 0; i < 4; i++) {
      const slot = SLOTS[i];
      const active = slot === PLAYER.slot;
      const bx = W - 28 - (3 - i) * 62 - 26;
      const by = H - 44;
      ctx.fillStyle = active ? 'rgba(120,220,255,0.22)' : 'rgba(20,28,48,0.6)';
      ctx.fillRect(bx, by, 56, 26);
      ctx.strokeStyle = active ? 'rgba(120,220,255,0.8)' : 'rgba(90,120,180,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, 55, 25);
      ctx.fillStyle = active ? '#bfeaff' : 'rgba(160,190,235,0.55)';
      ctx.font = '700 10px ui-monospace, monospace';
      ctx.fillText(PLAYER.loadout[slot] ? PLAYER.loadout[slot].name.slice(0, 7) : '--', bx + 28, by + 8);
      ctx.fillStyle = 'rgba(140,175,230,0.4)';
      ctx.font = '600 8px ui-monospace, monospace';
      ctx.fillText(String(i + 1), bx + 28, by + 19);
    }
  }

  // objective
  ctx.textAlign = 'center';

  if (sessionMode === 'chapters') {
    const quotaLeft = Math.max(0, phaseQuota - phaseKills);
    const ready = quotaLeft === 0;
    const objText = !ready ? 'CLEAR THE AREA'
      : phase === 'find' ? 'FIND THE BUNKER'
      : phase === 'switch' ? 'FIND THE POWER SWITCH'
      : 'ESCAPE';

    ctx.font = '800 20px ui-monospace, monospace';
    ctx.fillStyle = !ready ? 'rgba(255,206,120,0.98)'
      : phase === 'escape' ? 'rgba(255,150,120,0.98)' : 'rgba(170,235,255,0.95)';
    ctx.shadowColor = !ready ? '#ffb347' : phase === 'escape' ? '#ff5a3c' : '#3fc9ff';
    ctx.shadowBlur = 14;
    ctx.fillText(objText, W / 2, 16);
    ctx.shadowBlur = 0;

    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.55)';
    ctx.fillText('CHAPTER ' + chapter().n + ' — ' + chapter().name +
      (indoorMode ? '   ·   UNDERGROUND' : '') +
      '   ·   ' + phaseKills + '/' + phaseQuota, W / 2, 42);

    // kill quota / proximity bar
    const barW = 210, barX = W / 2 - barW / 2, barY = 62;
    const frac = ready ? proximity : clamp(phaseKills / Math.max(1, phaseQuota), 0, 1);
    ctx.fillStyle = 'rgba(8,12,24,0.7)';
    ctx.fillRect(barX, barY, barW, 5);
    ctx.fillStyle = ready ? 'rgba(110,255,180,0.9)' : 'rgba(255,190,90,0.9)';
    ctx.fillRect(barX, barY, barW * frac, 5);
    ctx.strokeStyle = 'rgba(120,170,255,0.22)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX + 0.5, barY + 0.5, barW - 1, 4);
    ctx.font = '600 9px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.45)';
    ctx.fillText(ready ? 'SIGNAL' : 'KILLS', W / 2, barY + 9);
  } else {
    const modeName = sessionMode === 'normal' ? 'NORMAL'
      : sessionMode === 'endless' ? 'ENDLESS' : 'RANDOMIZED';
    ctx.font = '800 20px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(170,235,255,0.95)';
    ctx.shadowColor = '#3fc9ff';
    ctx.shadowBlur = 14;
    ctx.fillText(sessionMode === 'normal' ? 'FIRST TO 5' : 'KILLS ' + score.you, W / 2, 16);
    ctx.shadowBlur = 0;

    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.55)';
    ctx.fillText(modeName + '  ·  ' + (MAPS[selectedMap] ? MAPS[selectedMap].name : '') +
      '  ·  WAVE ' + wave + '  ·  ' + score.you + ' KILLS', W / 2, 42);
  }

  // cash
  ctx.textAlign = 'center';
  ctx.font = '800 16px ui-monospace, monospace';
  const cashCol = cashFlash > 0 ? 'rgba(150,255,190,' + (0.6 + cashFlash * 0.4).toFixed(2) + ')' : 'rgba(140,255,180,0.75)';
  ctx.fillStyle = cashCol;
  ctx.fillText('$' + cash, W / 2, 80);

  // feed (kept clear of the objective block)
  ctx.textAlign = 'left';
  for (let i = 0; i < feed.length; i++) {
    const f = feed[i];
    ctx.globalAlpha = clamp(f.life / 1.2, 0, 1) * 0.85;
    ctx.font = '600 13px ui-monospace, monospace';
    ctx.fillStyle = '#cfe6ff';
    ctx.fillText(f.text, 26, 104 + i * 20);
  }
  ctx.globalAlpha = 1;

  // damage vignette
  if (PLAYER.dmgFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)');
    g.addColorStop(1, 'rgba(255,0,40,' + (0.55 * PLAYER.dmgFlash).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  drawMinimap();
  drawCrosshair();

  // wave banner
  if (waveBanner) {
    const a = clamp(Math.min(waveBanner.life, waveBanner.max - waveBanner.life) / 0.4, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '900 38px ui-monospace, monospace';
    ctx.fillStyle = '#9dffd0';
    ctx.shadowColor = '#3dffb0';
    ctx.shadowBlur = 26;
    ctx.fillText(waveBanner.text, W / 2, H * 0.20);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // pointer-lock hint
  if (!locked) {
    ctx.textAlign = 'center';
    ctx.font = '700 12px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,215,120,0.92)';
    ctx.fillText('MOUSE NOT LOCKED  —  CLICK TO AIM WITH THE MOUSE', W / 2, H - 126);
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(190,215,255,0.7)';
    ctx.fillText('ARROW KEYS TURN THE CAMERA  ·  RIGHT-CLICK + DRAG ALSO TURNS', W / 2, H - 108);
  }

  ctx.restore();
}
