function loginLayout() {
  const names = accountNames();
  const cols = 3;
  const gap = 14;
  const cardW = Math.min(260, (W - 160 - gap * (cols - 1)) / cols);
  const cardH = 62;
  const totalW = cardW * cols + gap * (cols - 1);
  const startX = W / 2 - totalW / 2;
  const startY = H * 0.34;

  const cards = names.map((n, i) => ({
    name: n,
    x: startX + (i % cols) * (cardW + gap),
    y: startY + Math.floor(i / cols) * (cardH + gap),
    w: cardW,
    h: cardH
  }));

  const inputW = Math.min(430, W * 0.55);
  const nameField = { x: W / 2 - inputW / 2, y: H * 0.655, w: inputW, h: 50 };
  const passField = { x: W / 2 - inputW / 2, y: H * 0.735, w: inputW, h: 50 };

  return { cards, nameField, passField };
}

function drawLogin() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(6,9,20,0.97)');
  g.addColorStop(1, 'rgba(3,4,10,0.99)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const titleSize = Math.round(clamp(Math.min(W, H) * 0.085, 28, 78));

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + titleSize + 'px ui-monospace, monospace';
  ctx.fillStyle = '#eaf6ff';
  ctx.shadowColor = '#3fc9ff';
  ctx.shadowBlur = 40;
  ctx.fillText('THE FINAL TWILIGHT', cx, H * 0.16);
  ctx.shadowBlur = 0;

  ctx.font = '600 11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,195,255,0.65)';
  ctx.fillText('SIGN IN TO SAVE YOUR CASH, WEAPONS AND RECORD', cx, H * 0.16 + titleSize * 0.72);

  const lay = loginLayout();

  ctx.textAlign = 'left';
  ctx.font = '700 11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.55)';
  ctx.fillText('OPERATIVES ON THIS MACHINE', lay.nameField.x, H * 0.27);

  if (lay.cards.length === 0) {
    ctx.textAlign = 'center';
    ctx.font = '600 12px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,180,225,0.45)';
    ctx.fillText('NO OPERATIVES YET — TYPE A NAME BELOW TO CREATE ONE', cx, H * 0.40);
  }

  for (const card of lay.cards) {
    const isCurrent = card.name === currentUser;
    ctx.fillStyle = isCurrent ? 'rgba(30,54,70,0.95)' : 'rgba(16,24,42,0.9)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    ctx.strokeStyle = isCurrent ? 'rgba(120,255,190,0.8)' : 'rgba(110,160,255,0.32)';
    ctx.lineWidth = isCurrent ? 2 : 1.5;
    ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);

    const p = accounts[card.name] || {};
    ctx.textAlign = 'left';
    ctx.font = '800 14px ui-monospace, monospace';
    ctx.fillStyle = '#e9f4ff';
    ctx.fillText(card.name, card.x + 14, card.y + 22);

    ctx.font = '600 9px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.6)';
    const st = p.stats || {};
    ctx.fillText('$' + (p.cash || 0) + '   ·   ' + (st.kills || 0) + ' KILLS   ·   ' + (st.wins || 0) + ' WINS', card.x + 14, card.y + 42);
  }

  // ---- name field
  const nf = lay.nameField;
  const nameActive = activeField === 'name';
  ctx.fillStyle = 'rgba(12,18,34,0.95)';
  ctx.fillRect(nf.x, nf.y, nf.w, nf.h);
  ctx.strokeStyle = nameActive ? 'rgba(120,220,255,0.95)' : 'rgba(90,120,170,0.4)';
  ctx.lineWidth = nameActive ? 2.5 : 1.5;
  ctx.strokeRect(nf.x + 0.5, nf.y + 0.5, nf.w - 1, nf.h - 1);

  ctx.textAlign = 'left';
  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.55)';
  ctx.fillText('OPERATIVE NAME', nf.x + 14, nf.y - 10);

  ctx.font = '800 19px ui-monospace, monospace';
  ctx.fillStyle = nameInput.length ? '#eaf6ff' : 'rgba(140,165,205,0.4)';
  const nameShown = nameInput.length ? nameInput : 'TYPE A NAME';
  ctx.fillText(nameShown, nf.x + 18, nf.y + nf.h / 2);

  if (nameActive && Math.floor(tNow * 2) % 2 === 0) {
    const tw = ctx.measureText(nameShown).width;
    ctx.fillStyle = '#7bf0ff';
    ctx.fillRect(nf.x + 20 + tw, nf.y + nf.h / 2 - 11, 2, 22);
  }

  // ---- passcode field
  const pf = lay.passField;
  const passActive = activeField === 'pass';
  ctx.fillStyle = 'rgba(12,18,34,0.95)';
  ctx.fillRect(pf.x, pf.y, pf.w, pf.h);
  ctx.strokeStyle = passActive ? 'rgba(255,190,120,0.95)' : 'rgba(90,120,170,0.4)';
  ctx.lineWidth = passActive ? 2.5 : 1.5;
  ctx.strokeRect(pf.x + 0.5, pf.y + 0.5, pf.w - 1, pf.h - 1);

  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.55)';
  ctx.fillText('PASSCODE', pf.x + 14, pf.y - 10);

  const masked = passInput.replace(/./g, '•');
  ctx.font = '800 19px ui-monospace, monospace';
  ctx.fillStyle = passInput.length ? '#ffe6c8' : 'rgba(140,165,205,0.4)';
  const passShown = passInput.length ? masked : 'TYPE A PASSCODE';
  ctx.fillText(passShown, pf.x + 18, pf.y + pf.h / 2);

  if (passActive && Math.floor(tNow * 2) % 2 === 0) {
    const tw = ctx.measureText(passShown).width;
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(pf.x + 20 + tw, pf.y + pf.h / 2 - 11, 2, 22);
  }

  ctx.textAlign = 'center';
  if (loginError) {
    ctx.font = '700 12px ui-monospace, monospace';
    ctx.fillStyle = '#ff8fa5';
    ctx.fillText(loginError, cx, pf.y + pf.h + 26);
  } else {
    const known = accounts[nameInput] ? true : false;
    const pulse = 0.6 + Math.sin(tNow * 2.6) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.font = '700 12px ui-monospace, monospace';
    ctx.fillStyle = '#7bf0ff';
    ctx.fillText(nameInput
      ? (known ? 'PRESS ENTER TO SIGN IN' : 'NEW OPERATIVE — ENTER TO CREATE WITH THIS PASSCODE')
      : 'CLICK AN OPERATIVE OR TYPE A NAME', cx, pf.y + pf.h + 26);
    ctx.globalAlpha = 1;
  }

  ctx.font = '600 9px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(130,160,200,0.4)';
  ctx.fillText('TAB SWITCHES FIELD  ·  PROGRESS AND PASSCODES STAY IN THIS BROWSER', cx, H * 0.95);

  ctx.restore();
}

function menuLayout() {
  const gap = 14;

  const modeW = Math.min(228, (W - 150 - gap * 3) / 4);
  const modeH = 62;
  const modeTotal = modeW * 4 + gap * 3;
  const modeX = W / 2 - modeTotal / 2;
  const modeY = H * 0.245;

  const cardW = Math.min(300, (W - 160 - gap * 2) / 3);
  const cardH = 124;
  const totalW = cardW * 3 + gap * 2;
  const x0 = W / 2 - totalW / 2;
  const cardY = H * 0.40;

  const mapW = Math.min(230, (W - 150 - gap * 3) / 4);
  const mapH = 58;
  const mapTotal = mapW * 4 + gap * 3;
  const mapX = W / 2 - mapTotal / 2;
  const mapY = H * 0.40;

  const shopW = 180, deployW = 200;
  const totalBtn = shopW + 16 + deployW;
  const bx = W / 2 - totalBtn / 2;
  const btnY = H * 0.845;

  const clsW = Math.min(200, (W - 150 - gap * 3) / 4);
  const clsH = 42;
  const clsTotal = clsW * 4 + gap * 3;
  const clsX = W / 2 - clsTotal / 2;
  const clsY = H * 0.655;

  return {
    modes: MODE_LABELS.map((label, i) => ({
      index: i, label,
      x: modeX + i * (modeW + gap), y: modeY, w: modeW, h: modeH
    })),
    chapters: CHAPTERS.map((c, i) => ({
      index: i,
      x: x0 + i * (cardW + gap),
      y: cardY,
      w: cardW,
      h: cardH
    })),
    maps: MAPS.map((m, i) => ({
      index: i,
      x: mapX + (i % 4) * (mapW + gap),
      y: mapY + Math.floor(i / 4) * (mapH + 10),
      w: mapW,
      h: mapH
    })),
    classes: CLASSES.map((c, i) => ({
      index: i,
      x: clsX + i * (clsW + gap), y: clsY, w: clsW, h: clsH
    })),
    shop: { x: bx, y: btnY, w: shopW, h: 44 },
    deploy: { x: bx + shopW + 16, y: btnY, w: deployW, h: 44 },
    switchBtn: { x: W - 142, y: 20, w: 118, h: 30 }
  };
}

function cardHovered(r, mx, my) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

function drawButton(r, label, active, accent) {
  ctx.fillStyle = active ? 'rgba(38,62,104,0.95)' : 'rgba(16,24,42,0.9)';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = active ? accent : 'rgba(110,160,255,0.30)';
  ctx.lineWidth = active ? 2.5 : 1.5;
  if (active) { ctx.shadowColor = accent; ctx.shadowBlur = 20; }
  ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.max(13, Math.round(15 * uiScale())) + 'px ui-monospace, monospace';
  ctx.fillStyle = active ? '#eaf8ff' : 'rgba(215,232,255,0.8)';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
}

function drawMenu() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(6,8,18,0.94)');
  g.addColorStop(1, 'rgba(3,4,10,0.99)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // faint grid backdrop
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#6fd0ff';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 56) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 56) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  const lay = menuLayout();
  const cx = W / 2;
  const titleSize = Math.round(clamp(Math.min(W, H) * 0.095, 30, 88));

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + titleSize + 'px ui-monospace, monospace';
  ctx.fillStyle = '#eaf6ff';
  ctx.shadowColor = '#3fc9ff';
  ctx.shadowBlur = 44;
  ctx.fillText('THE FINAL TWILIGHT', cx, H * 0.16);
  ctx.shadowBlur = 12;
  ctx.font = '600 12px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,195,255,0.7)';
  ctx.fillText('FIND THE BUNKER  ·  GO INSIDE  ·  GET OUT ALIVE', cx, H * 0.16 + titleSize * 0.72);

  // ---- mode row
  for (const card of lay.modes) {
    const sel = card.index === menuModeIndex;
    ctx.fillStyle = sel ? 'rgba(40,44,62,0.96)' : 'rgba(16,22,36,0.85)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    ctx.strokeStyle = sel ? 'rgba(255,120,90,0.95)' : 'rgba(110,160,255,0.26)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = '#ff6a4a'; ctx.shadowBlur = 18; }
    ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.font = '800 14px ui-monospace, monospace';
    ctx.fillStyle = sel ? '#fff0e8' : '#d8e6f5';
    ctx.fillText(card.label, card.x + card.w / 2, card.y + 24);

    ctx.font = '600 9px ui-monospace, monospace';
    ctx.fillStyle = sel ? 'rgba(255,190,160,0.85)' : 'rgba(150,185,235,0.5)';
    const sub = card.index === 0 ? 'story missions'
      : card.index === 1 ? 'first to 5 kills'
      : card.index === 2 ? 'survive the waves'
      : 'new gun every kill';
    ctx.fillText(sub, card.x + card.w / 2, card.y + 44);
  }

  if (menuModeIndex === 0) {
    // ---- chapters
    ctx.textAlign = 'left';
    ctx.font = '700 10px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(140,180,240,0.55)';
    ctx.fillText('CHAPTERS', lay.chapters[0].x, lay.chapters[0].y - 14);

    for (const card of lay.chapters) {
    const ch = CHAPTERS[card.index];
    const unlocked = card.index <= progress;
    const sel = card.index === menuChapter;
    const locked = !unlocked;

    ctx.fillStyle = locked ? 'rgba(12,14,22,0.85)'
      : sel ? 'rgba(34,40,58,0.95)' : 'rgba(16,22,36,0.85)';
    ctx.fillRect(card.x, card.y, card.w, card.h);

    ctx.strokeStyle = locked ? 'rgba(80,90,110,0.28)'
      : sel ? 'rgba(255,120,90,0.95)' : 'rgba(110,160,255,0.28)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = '#ff6a4a'; ctx.shadowBlur = 22; }
    ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = '700 9px ui-monospace, monospace';
    ctx.fillStyle = locked ? 'rgba(120,130,150,0.5)' : 'rgba(255,140,110,0.85)';
    ctx.fillText('CHAPTER ' + ch.n, card.x + 16, card.y + 20);

    ctx.font = '800 16px ui-monospace, monospace';
    ctx.fillStyle = locked ? 'rgba(150,160,180,0.45)' : '#eaf6ff';
    ctx.fillText(ch.name, card.x + 16, card.y + 42);

    ctx.font = '500 10px ui-monospace, monospace';
    ctx.fillStyle = locked ? 'rgba(120,130,150,0.4)' : 'rgba(160,190,225,0.65)';
    wrapText(ch.brief, card.x + 16, card.y + 62, card.w - 32, 13);

    ctx.font = '700 11px ui-monospace, monospace';
    if (locked) {
      ctx.fillStyle = 'rgba(150,160,180,0.45)';
      ctx.fillText('LOCKED — CLEAR CHAPTER ' + (card.index), card.x + 16, card.y + card.h - 16);
    } else {
      ctx.fillStyle = 'rgba(140,255,180,0.85)';
      ctx.fillText('$' + ch.reward, card.x + 16, card.y + card.h - 16);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(150,185,235,0.5)';
      ctx.fillText(card.index <= progress - 1 ? 'CLEARED' : (sel ? 'SELECTED' : 'READY'), card.x + card.w - 16, card.y + card.h - 16);
    }
    }
  } else {
    // ---- map picker for free play
    ctx.textAlign = 'left';
    ctx.font = '700 10px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(140,180,240,0.55)';
    ctx.fillText('ARENA', lay.maps[0].x, lay.maps[0].y - 14);

    for (const card of lay.maps) {
      const mp = MAPS[card.index];
      const sel = card.index === menuMapIndex;
      ctx.fillStyle = sel ? 'rgba(34,40,58,0.95)' : 'rgba(16,22,36,0.85)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = sel ? mp.tint : 'rgba(110,160,255,0.26)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      if (sel) { ctx.shadowColor = mp.tint; ctx.shadowBlur = 18; }
      ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
      ctx.shadowBlur = 0;

      ctx.textAlign = 'left';
      ctx.font = '800 12px ui-monospace, monospace';
      ctx.fillStyle = sel ? mp.tint : '#dff2ff';
      ctx.fillText(mp.name, card.x + 12, card.y + 22);
      ctx.font = '500 9px ui-monospace, monospace';
      ctx.fillStyle = sel ? 'rgba(200,230,255,0.8)' : 'rgba(150,185,235,0.5)';
      ctx.fillText(mp.desc, card.x + 12, card.y + 40);
    }
  }

  // ---- class row
  ctx.textAlign = 'left';
  ctx.font = '700 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.55)';
  ctx.fillText('CLASS', lay.classes[0].x, lay.classes[0].y - 12);

  for (const chip of lay.classes) {
    const cl = CLASSES[chip.index];
    const sel = chip.index === chosenClass;
    ctx.fillStyle = sel ? 'rgba(34,40,58,0.96)' : 'rgba(16,22,36,0.85)';
    ctx.fillRect(chip.x, chip.y, chip.w, chip.h);
    ctx.strokeStyle = sel ? cl.color : 'rgba(110,160,255,0.26)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = cl.color; ctx.shadowBlur = 14; }
    ctx.strokeRect(chip.x + 0.5, chip.y + 0.5, chip.w - 1, chip.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = '800 12px ui-monospace, monospace';
    ctx.fillStyle = sel ? cl.color : 'rgba(215,232,255,0.75)';
    ctx.fillText(cl.name, chip.x + 10, chip.y + 17);
    ctx.font = '500 8px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.5)';
    ctx.fillText(cl.desc, chip.x + 10, chip.y + 31);
  }

  // ---- controls
  ctx.textAlign = 'center';
  ctx.font = '600 11px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(170,195,245,0.55)';
  const ctrl = [
    'WASD  MOVE      ARROWS  LOOK      CLICK  SHOOT      RIGHT-CLICK  AIM',
    'SPACE  JUMP      SHIFT  SLIDE      R  RELOAD      E  DOORS      Q / WHEEL  SWAP'
  ];
  for (let i = 0; i < ctrl.length; i++) ctx.fillText(ctrl[i], cx, lay.shop.y - 72 + i * 17);

  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,185,235,0.5)';
  ctx.fillText('MOUSE SENSITIVITY  ' + PLAYER.sens.toFixed(1) + '     [  /  ]  TO CHANGE', cx, lay.shop.y - 34);

  // ---- cash
  ctx.font = '800 20px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,255,180,0.95)';
  ctx.shadowColor = '#3dffb0';
  ctx.shadowBlur = 18;
  ctx.fillText('$' + cash, cx, lay.shop.y - 16);
  ctx.shadowBlur = 0;

  // ---- buttons
  drawButton(lay.shop, 'ARMORY', true, '#ffb347');
  drawButton(lay.deploy, 'DEPLOY', true, '#3fc9ff');

  // ---- account badge
  ctx.textAlign = 'left';
  ctx.font = '700 9px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.45)';
  ctx.fillText('OPERATIVE', 26, 16);
  ctx.font = '800 13px ui-monospace, monospace';
  ctx.fillStyle = '#dff2ff';
  ctx.fillText(currentUser || 'GUEST', 26, 30);

  ctx.textAlign = 'right';
  ctx.font = '600 9px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,185,235,0.45)';
  ctx.fillText(stats.kills + ' KILLS  ·  ' + stats.wins + ' WINS', W - 142, 40);
  drawButton(lay.switchBtn, 'SWITCH', false, '#5fc9ff');

  const pulse = 0.6 + Math.sin(tNow * 2.6) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.font = '700 11px ui-monospace, monospace';
  ctx.fillStyle = '#7bf0ff';
  const target = menuModeIndex === 0
    ? 'CHAPTER ' + (menuChapter + 1) + ' — ' + CHAPTERS[menuChapter].name
    : MODE_LABELS[menuModeIndex] + ' ON ' + MAPS[menuMapIndex].name;
  ctx.fillText('ENTER  —  ' + target, cx, lay.deploy.y + lay.deploy.h + 22);
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ------------------------------------------------------------
//  ARMORY (weapon shop)
// ------------------------------------------------------------
const SHOP_CATS = [
  { key: 'main', label: 'MAIN' },
  { key: 'secondary', label: 'SECONDARY' },
  { key: 'bomb', label: 'BOMB' },
  { key: 'knife', label: 'KNIFE' }
];
let shopCategory = 'main';

function shopLayout() {
  const gap = 14;

  const tabW = Math.min(190, (W - 150 - gap * 3) / 4);
  const tabH = 46;
  const tabTotal = tabW * 4 + gap * 3;
  const tx = W / 2 - tabTotal / 2;
  const ty = H * 0.235;
  const tabs = SHOP_CATS.map((c, i) => ({
    key: c.key,
    label: c.label,
    x: tx + i * (tabW + gap),
    y: ty,
    w: tabW,
    h: tabH
  }));

  const list = WEAPONS[shopCategory] || [];
  const cols = Math.min(3, Math.max(1, list.length));
  const cardW = Math.min(290, (W - 200 - gap * (cols - 1)) / cols);
  const cardH = 142;
  const rows = Math.ceil(list.length / cols);
  const startX = W / 2 - (cardW * cols + gap * (cols - 1)) / 2;
  const startY = ty + tabH + 42;

  const cards = list.map((w, i) => ({
    id: w.id,
    x: startX + (i % cols) * (cardW + gap),
    y: startY + Math.floor(i / cols) * (cardH + gap),
    w: cardW,
    h: cardH
  }));

  const backW = 180, backH = 40;
  const back = { x: W / 2 - backW / 2, y: startY + rows * (cardH + gap) + 6, w: backW, h: backH };

  return { tabs, cards, back };
}

function drawShop() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(10,8,16,0.97)');
  g.addColorStop(1, 'rgba(4,4,10,0.99)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(clamp(Math.min(W, H) * 0.05, 24, 46)) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#eaf6ff';
  ctx.shadowColor = '#ffb347';
  ctx.shadowBlur = 30;
  ctx.fillText('ARMORY', 44, H * 0.12);
  ctx.shadowBlur = 0;

  ctx.font = '600 10px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,185,235,0.55)';
  ctx.fillText('UNLOCK WEAPONS  ·  CLICK TO BUY  ·  CLICK AN OWNED ONE TO EQUIP', 44, H * 0.12 + 30);

  ctx.textAlign = 'right';
  ctx.font = '900 26px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,255,180,0.95)';
  ctx.shadowColor = '#3dffb0';
  ctx.shadowBlur = 18;
  ctx.fillText('$' + cash, W - 44, H * 0.12);
  ctx.shadowBlur = 0;

  const lay = shopLayout();

  // ---- category tabs
  for (const tab of lay.tabs) {
    const sel = tab.key === shopCategory;
    ctx.fillStyle = sel ? 'rgba(40,44,62,0.97)' : 'rgba(16,22,36,0.9)';
    ctx.fillRect(tab.x, tab.y, tab.w, tab.h);
    ctx.strokeStyle = sel ? 'rgba(255,179,71,0.95)' : 'rgba(110,160,255,0.28)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 18; }
    ctx.strokeRect(tab.x + 0.5, tab.y + 0.5, tab.w - 1, tab.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.font = '800 14px ui-monospace, monospace';
    ctx.fillStyle = sel ? '#fff4e2' : 'rgba(215,232,255,0.75)';
    ctx.fillText(tab.label, tab.x + tab.w / 2, tab.y + tab.h / 2);

    // count of owned in this category
    const list = WEAPONS[tab.key] || [];
    let n = 0;
    for (const w2 of list) if (owned[w2.id]) n++;
    ctx.font = '600 8px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.45)';
    ctx.fillText(n + '/' + list.length, tab.x + tab.w / 2, tab.y + tab.h - 8);
  }

  for (const card of lay.cards) {
    const w = findWeapon(card.id);
    if (!w) continue;
    const isOwned = !!owned[card.id];
    const isEquipped = equipped[w.slot] === card.id;
    const price = PRICES[card.id] || 0;

    ctx.fillStyle = isEquipped ? 'rgba(28,62,48,0.95)' : isOwned ? 'rgba(20,34,56,0.9)' : 'rgba(14,18,30,0.9)';
    ctx.fillRect(card.x, card.y, card.w, card.h);

    ctx.strokeStyle = isEquipped ? 'rgba(120,255,190,0.95)'
      : isOwned ? 'rgba(110,170,255,0.55)'
      : 'rgba(90,110,150,0.35)';
    ctx.lineWidth = isEquipped ? 2.5 : 1.5;
    if (isEquipped) { ctx.shadowColor = '#3dffb0'; ctx.shadowBlur = 18; }
    ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = '700 9px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(140,175,230,0.5)';
    ctx.fillText(w.slot.toUpperCase(), card.x + 14, card.y + 16);

    ctx.font = '800 19px ui-monospace, monospace';
    ctx.fillStyle = isOwned ? '#eaf6ff' : 'rgba(190,205,230,0.55)';
    ctx.fillText(w.name, card.x + 14, card.y + 40);

    ctx.font = '600 10px ui-monospace, monospace';
    ctx.fillStyle = isOwned ? 'rgba(160,195,240,0.7)' : 'rgba(140,160,190,0.4)';
    if (w.melee) {
      ctx.fillText('DMG ' + w.dmg + '      RANGE ' + w.range, card.x + 14, card.y + 64);
      ctx.fillText('SWINGS ' + w.rpm + '/MIN', card.x + 14, card.y + 82);
    } else {
      ctx.fillText('DMG ' + w.dmg + '      RPM ' + w.rpm, card.x + 14, card.y + 64);
      ctx.fillText('MAG ' + w.mag + '      RANGE ' + w.range + (w.pellets > 1 ? '      x' + w.pellets : ''), card.x + 14, card.y + 82);
    }

    // status line
    ctx.font = '800 12px ui-monospace, monospace';
    if (isEquipped) {
      ctx.fillStyle = '#8dffb0';
      ctx.fillText('EQUIPPED', card.x + 14, card.y + card.h - 18);
    } else if (isOwned) {
      ctx.fillStyle = 'rgba(120,200,255,0.85)';
      ctx.fillText('CLICK TO EQUIP', card.x + 14, card.y + card.h - 18);
    } else {
      const afford = cash >= price;
      ctx.fillStyle = afford ? 'rgba(255,215,120,0.95)' : 'rgba(255,120,140,0.75)';
      ctx.fillText('$' + price, card.x + 14, card.y + card.h - 18);
      ctx.textAlign = 'right';
      ctx.font = '700 9px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(160,185,225,0.45)';
      ctx.fillText(afford ? 'BUY' : 'LOCKED', card.x + card.w - 14, card.y + card.h - 18);
    }
  }

  drawButton(lay.back, 'BACK', true, '#5fc9ff');

  if (shopMsg) {
    ctx.globalAlpha = clamp(shopMsg.life / 0.4, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '800 14px ui-monospace, monospace';
    ctx.fillStyle = '#ffd166';
    ctx.fillText(shopMsg.text, W / 2, lay.back.y + lay.back.h + 26);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawPaused() {
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,14,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.round(clamp(Math.min(W, H) * 0.06, 28, 54)) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#dff2ff';
  ctx.shadowColor = '#3fc9ff';
  ctx.shadowBlur = 26;
  ctx.fillText('PAUSE', W / 2, H * 0.40);
  ctx.shadowBlur = 0;
  ctx.font = '600 13px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(160,195,245,0.7)';
  ctx.fillText('CLICK / ESC  TO RESUME', W / 2, H * 0.50);
  ctx.fillStyle = 'rgba(160,195,245,0.45)';
  ctx.fillText('Q  QUIT TO MENU', W / 2, H * 0.55);
  ctx.font = '600 11px ui-monospace, monospace';
  ctx.fillText('[  /  ]  MOUSE SENSITIVITY  ' + PLAYER.sens.toFixed(1), W / 2, H * 0.61);
  ctx.restore();
}

function drawEnd(win) {
  ctx.save();
  ctx.fillStyle = win ? 'rgba(6,20,16,0.82)' : 'rgba(24,6,10,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '900 ' + Math.round(clamp(Math.min(W, H) * 0.075, 34, 78)) + 'px ui-monospace, monospace';
  ctx.fillStyle = win ? '#b9ffe0' : '#ff8fa5';
  ctx.shadowColor = win ? '#3dffb0' : '#ff2b55';
  ctx.shadowBlur = 34;
  ctx.fillText(win ? 'CHAPTER CLEAR' : 'YOU DIED', W / 2, H * 0.34);

  ctx.shadowBlur = 0;
  ctx.font = '700 13px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(200,220,245,0.7)';
  ctx.fillText('CHAPTER ' + chapter().n + ' — ' + chapter().name, W / 2, H * 0.42);

  ctx.font = '700 16px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(230,245,255,0.85)';
  ctx.fillText('KILLS: ' + score.you + '     DEATHS: ' + score.them, W / 2, H * 0.50);

  if (win) {
    ctx.font = '800 18px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(140,255,180,0.95)';
    ctx.shadowColor = '#3dffb0';
    ctx.shadowBlur = 16;
    ctx.fillText('+' + chapter().reward, W / 2, H * 0.57);
    ctx.shadowBlur = 0;
  }

  ctx.font = '800 15px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,255,180,0.9)';
  ctx.fillText('BALANCE  $' + cash, W / 2, H * 0.64);

  const pulse = 0.6 + Math.sin(tNow * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.font = '800 14px ui-monospace, monospace';
  ctx.fillStyle = '#7bf0ff';
  ctx.fillText(win ? 'ENTER  NEXT / REPLAY        ESC  MENU' : 'ENTER  TRY AGAIN        ESC  MENU', W / 2, H * 0.74);
  ctx.restore();
}

// ============================================================
//  MAIN RENDER
// ============================================================
let tNow = 0;

function render() {
  if (state === 'login') {
    ctx.fillStyle = '#05060b';
    ctx.fillRect(0, 0, W, H);
    drawLogin();
    return;
  }

  if (state === 'menu') {
    ctx.fillStyle = '#05060b';
    ctx.fillRect(0, 0, W, H);
    drawMenu();
    return;
  }

  if (state === 'shop') {
    ctx.fillStyle = '#05060b';
    ctx.fillRect(0, 0, W, H);
    drawShop();
    return;
  }

  if (state === 'vote') {
    drawVote();
    return;
  }

  ctx.save();
  if (screenShake > 0.3) {
    ctx.translate(rand(-1, 1) * screenShake * 0.5, rand(-1, 1) * screenShake * 0.5);
  }

  renderWorld();

  // sprites sorted far → near
  const drawList = [];
  for (const b of bots) {
    if (!b.alive && b.deathT >= 1) continue;
    const d = Math.hypot(b.x - PLAYER.x, b.y - PLAYER.y);
    drawList.push({ d, fn: () => drawZombie(b) });
  }
  drawList.sort((a, b2) => b2.d - a.d);
  for (const it of drawList) it.fn();

  drawProjectiles();
  drawAcids();
  drawParticles3D();
  drawTracers();
  drawFloaters();
  drawSpecials();

  ctx.restore();

  // colour grade: chapters use their story tint, free play uses the arena's
  const tint = sessionMode === 'chapters'
    ? chapter().tint
    : tintRGBA((MAPS[selectedMap] && MAPS[selectedMap].tint) || '#5fc9ff', 0.09);
  if (tint) {
    ctx.save();
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // horror vignette — dark corners, readable centre
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.26, W / 2, H / 2, Math.max(W, H) * 0.74);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.65, 'rgba(0,0,0,0.22)');
  vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // damage edges pulse red when hurt
  if (PLAYER.dmgFlash > 0) {
    const dg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    dg.addColorStop(0, 'rgba(180,0,30,0)');
    dg.addColorStop(1, 'rgba(180,0,30,' + (0.45 * PLAYER.dmgFlash).toFixed(3) + ')');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, H);
  }

  drawViewmodel();
  drawHUD();

  if (state === 'paused') drawPaused();
  else if (state === 'won') drawEnd(true);
  else if (state === 'lost') drawEnd(false);
}

// ============================================================
//  FLOW UI — everything is measured and stacked, so nothing overlaps
// ============================================================
function uiScale() {
  // tuned for 1280x720, grows on bigger screens, never shrinks past readability
  return clamp(Math.min(W / 1280, H / 720), 0.72, 1.5);
}

function layoutMenu() {
  const cx = W / 2;

  // sizes at scale 1, then shrink to fit the window
  const titleSize0 = clamp(H * 0.09, 30, 88);
  const K = 26 + titleSize0 * 0.95 + 8 + 13 + 22 + 80 + 22 + 166 + 18 + 64 + 14 + 34 + 10 + 60 + 12 + 14 + 26;
  let s = Math.min(1.5, (H * 0.98) / Math.max(320, K));
  s = Math.min(s, W / 900);
  s = clamp(s, 0.62, 1.5);

  const gap = 14 * s;
  const margin = 26 * s;
  const titleSize = Math.round(titleSize0 * s);

  let y = margin + Math.max(0, (H - K * s) * 0.35);

  const titleY = y + titleSize * 0.48;
  y += titleSize * 0.95 + 8 * s;
  const subY = y + 7 * s;
  y += 13 * s + 22 * s;

  const modeW = Math.min(232 * s, (W - 80 * s - gap * 3) / 4);
  const modeH = 80 * s;
  const modeTotal = modeW * 4 + gap * 3;
  const modes = MODE_LABELS.map((label, i) => ({
    index: i, label,
    x: cx - modeTotal / 2 + i * (modeW + gap), y, w: modeW, h: modeH
  }));
  y += modeH + 22 * s;

  const contentTop = y;
  const chW = Math.min(300 * s, (W - 80 * s - gap * 2) / 3);
  const chH = 158 * s;
  const chTotal = chW * 3 + gap * 2;
  const chapters = CHAPTERS.map((c, i) => ({
    index: i,
    x: cx - chTotal / 2 + i * (chW + gap),
    y: contentTop, w: chW, h: chH
  }));

  const mapW = Math.min(232 * s, (W - 80 * s - gap * 3) / 4);
  const mapH = 78 * s;
  const mapTotal = mapW * 4 + gap * 3;
  const maps = MAPS.map((m, i) => ({
    index: i,
    x: cx - mapTotal / 2 + (i % 4) * (mapW + gap),
    y: contentTop + Math.floor(i / 4) * (mapH + 10 * s),
    w: mapW, h: mapH
  }));

  const contentH = 166 * s;
  y = contentTop + contentH + 18 * s;

  const clsH = 64 * s;
  const clsW = Math.min(210 * s, (W - 80 * s - gap * 3) / 4);
  const clsTotal = clsW * 4 + gap * 3;
  const classes = CLASSES.map((c, i) => ({
    index: i,
    x: cx - clsTotal / 2 + i * (clsW + gap),
    y, w: clsW, h: clsH
  }));
  y += clsH + 14 * s;

  const cashY = y + 10 * s;
  y += 24 * s + 10 * s;

  const btnH = 60 * s;
  const shopW = Math.min(190 * s, (W - 80 * s) * 0.24);
  const deployW = Math.min(210 * s, (W - 80 * s) * 0.26);
  const btnTotal = shopW + 16 * s + deployW;
  const shop = { x: cx - btnTotal / 2, y, w: shopW, h: btnH };
  const deploy = { x: cx - btnTotal / 2 + shopW + 16 * s, y, w: deployW, h: btnH };
  y += btnH + 12 * s;

  const hintY = y + 7 * s;

  return {
    s, cx, titleY, titleSize, subY, subSize: Math.round(13 * s * 1.45),
    modes, chapters, maps, contentTop, contentH, classes,
    cashY, shop, deploy, hintY,
    switchBtn: { x: W - 24 * s - 118 * s, y: 18 * s, w: 118 * s, h: 30 * s }
  };
}

function drawMenu() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0f1e');
  g.addColorStop(1, '#05070f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // faint grid backdrop
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#6fd0ff';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 56) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 56) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  const lay = layoutMenu();
  const s = lay.s;
  const cx = lay.cx;

  // header
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + lay.titleSize + 'px ui-monospace, monospace';
  ctx.fillStyle = '#eaf6ff';
  ctx.shadowColor = '#3fc9ff';
  ctx.shadowBlur = 34;
  ctx.fillText('THE FINAL TWILIGHT', cx, lay.titleY);
  ctx.shadowBlur = 0;

  ctx.font = '600 ' + lay.subSize + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(160,200,255,0.7)';
  ctx.fillText('FIND THE BUNKER  ·  GO INSIDE  ·  GET OUT ALIVE', cx, lay.subY);

  // modes
  for (const card of lay.modes) {
    const sel = card.index === menuModeIndex;
    ctx.fillStyle = sel ? 'rgba(38,44,64,0.96)' : 'rgba(15,20,34,0.9)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    ctx.strokeStyle = sel ? 'rgba(255,120,90,0.95)' : 'rgba(110,160,255,0.26)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = '#ff6a4a'; ctx.shadowBlur = 16; }
    ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(14 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = sel ? '#fff0e8' : '#d8e6f5';
    ctx.fillText(card.label, card.x + card.w / 2, card.y + card.h * 0.38);

    ctx.font = '600 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = sel ? 'rgba(255,190,160,0.9)' : 'rgba(150,185,235,0.5)';
    const sub = card.index === 0 ? 'story missions'
      : card.index === 1 ? 'first to 5 kills'
      : card.index === 2 ? 'survive the waves'
      : 'new gun every kill';
    ctx.fillText(sub, card.x + card.w / 2, card.y + card.h * 0.68);
  }

  // content: chapters or maps
  if (menuModeIndex === 0) {
    for (const card of lay.chapters) {
      const ch = CHAPTERS[card.index];
      const unlocked = card.index <= progress;
      const sel = card.index === menuChapter;

      ctx.fillStyle = !unlocked ? 'rgba(12,14,22,0.85)'
        : sel ? 'rgba(34,40,58,0.96)' : 'rgba(16,22,36,0.88)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = !unlocked ? 'rgba(80,90,110,0.28)'
        : sel ? 'rgba(255,120,90,0.95)' : 'rgba(110,160,255,0.28)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      if (sel) { ctx.shadowColor = '#ff6a4a'; ctx.shadowBlur = 18; }
      ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
      ctx.shadowBlur = 0;

      const pad = 14 * s;
      ctx.textAlign = 'left';
      ctx.font = '700 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(120,130,150,0.5)' : 'rgba(255,140,110,0.85)';
      ctx.fillText('CHAPTER ' + ch.n, card.x + pad, card.y + 20 * s);

      ctx.font = '800 ' + Math.round(15 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(150,160,180,0.45)' : '#eaf6ff';
      ctx.fillText(ch.name, card.x + pad, card.y + 42 * s);

      ctx.font = '500 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(120,130,150,0.4)' : 'rgba(160,190,225,0.65)';
      wrapText(ch.brief, card.x + pad, card.y + 60 * s, card.w - pad * 2, 12 * s);

      ctx.font = '700 ' + Math.round(10 * s * 1.45) + 'px ui-monospace, monospace';
      if (!unlocked) {
        ctx.fillStyle = 'rgba(150,160,180,0.45)';
        ctx.fillText('LOCKED', card.x + pad, card.y + card.h - 14 * s);
      } else {
        ctx.fillStyle = 'rgba(140,255,180,0.85)';
        ctx.fillText('$' + ch.reward, card.x + pad, card.y + card.h - 14 * s);
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(150,185,235,0.5)';
        ctx.fillText(card.index < progress ? 'CLEARED' : (sel ? 'SELECTED' : 'READY'),
          card.x + card.w - pad, card.y + card.h - 14 * s);
      }
    }
  } else {
    for (const card of lay.maps) {
      const mp = MAPS[card.index];
      const sel = card.index === menuMapIndex;
      ctx.fillStyle = sel ? 'rgba(34,40,58,0.96)' : 'rgba(16,22,36,0.88)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = sel ? mp.tint : 'rgba(110,160,255,0.26)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      if (sel) { ctx.shadowColor = mp.tint; ctx.shadowBlur = 16; }
      ctx.strokeRect(card.x + 0.5, card.y + 0.5, card.w - 1, card.h - 1);
      ctx.shadowBlur = 0;

      ctx.textAlign = 'left';
      ctx.font = '800 ' + Math.round(11 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = sel ? mp.tint : '#dff2ff';
      ctx.fillText(mp.name, card.x + 10 * s, card.y + 20 * s);
      ctx.font = '500 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = sel ? 'rgba(200,230,255,0.8)' : 'rgba(150,185,235,0.5)';
      ctx.fillText(mp.desc, card.x + 10 * s, card.y + 38 * s);
    }
  }

  // classes
  for (const chip of lay.classes) {
    const cl = CLASSES[chip.index];
    const sel = chip.index === chosenClass;
    ctx.fillStyle = sel ? 'rgba(34,40,58,0.96)' : 'rgba(16,22,36,0.88)';
    ctx.fillRect(chip.x, chip.y, chip.w, chip.h);
    ctx.strokeStyle = sel ? cl.color : 'rgba(110,160,255,0.26)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    if (sel) { ctx.shadowColor = cl.color; ctx.shadowBlur = 14; }
    ctx.strokeRect(chip.x + 0.5, chip.y + 0.5, chip.w - 1, chip.h - 1);
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.font = '800 ' + Math.round(11 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = sel ? cl.color : 'rgba(215,232,255,0.75)';
    ctx.fillText(cl.name, chip.x + 9 * s, chip.y + 16 * s);
    ctx.font = '500 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.5)';
    ctx.fillText(cl.desc, chip.x + 9 * s, chip.y + 31 * s);
  }

  // cash
  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.round(19 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,255,180,0.95)';
  ctx.shadowColor = '#3dffb0';
  ctx.shadowBlur = 14;
  ctx.fillText('$' + cash, cx, lay.cashY);
  ctx.shadowBlur = 0;

  // buttons
  drawButton(lay.shop, 'ARMORY', true, '#ffb347');
  drawButton(lay.deploy, 'PLAY', true, '#3fc9ff');

  // hint
  const target = menuModeIndex === 0
    ? 'CHAPTER ' + (menuChapter + 1) + ' — ' + CHAPTERS[menuChapter].name
    : MODE_LABELS[menuModeIndex] + ' ON ' + MAPS[menuMapIndex].name;
  ctx.globalAlpha = 0.6 + Math.sin(tNow * 2.6) * 0.4;
  ctx.textAlign = 'center';
  ctx.font = '700 ' + Math.round(10 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#7bf0ff';
  ctx.fillText('ENTER  —  ' + target, cx, lay.hintY);
  ctx.globalAlpha = 1;

  // account badge
  ctx.textAlign = 'left';
  ctx.font = '700 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.45)';
  ctx.fillText('OPERATIVE', 20 * s, 16 * s);
  ctx.font = '800 ' + Math.round(12 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#dff2ff';
  ctx.fillText(currentUser || 'GUEST', 20 * s, 30 * s);

  drawButton(lay.switchBtn, 'SWITCH', false, '#5fc9ff');

  ctx.restore();
}

// ------------------------------------------------------------
function layoutLogin() {
  const s = uiScale();
  const cx = W / 2;
  const names = accountNames().slice(0, 6);

  const titleSize = Math.round(clamp(H * 0.075, 28, 70) * s);
  let y = H * 0.12;

  const titleY = y + titleSize * 0.5;
  y += titleSize + 12 * s;

  const subY = y + 6 * s;
  y += 20 * s + 22 * s;

  const cols = 3;
  const gap = 12 * s;
  const cardW = Math.min(250 * s, (W - 80 * s - gap * 2) / 3);
  const cardH = 78 * s;
  const totalW = cardW * 3 + gap * 2;
  const cards = names.map((n, i) => ({
    name: n,
    x: cx - totalW / 2 + (i % cols) * (cardW + gap),
    y: y + Math.floor(i / cols) * (cardH + gap),
    w: cardW, h: cardH
  }));
  const rows = Math.max(1, Math.ceil(names.length / cols));
  y += rows * (cardH + gap) + 20 * s;

  const fieldW = Math.min(430 * s, W * 0.6);
  const fieldH = 60 * s;
  const nameField = { x: cx - fieldW / 2, y, w: fieldW, h: fieldH };
  y += fieldH + 28 * s;
  const passField = { x: cx - fieldW / 2, y, w: fieldW, h: fieldH };
  y += fieldH + 30 * s;

  return {
    s, cx, titleY, titleSize, subY,
    cards, nameField, passField,
    hintY: y,
    more: Math.max(0, accountNames().length - 6)
  };
}

function layoutShop() {
  const s = uiScale();
  const cx = W / 2;

  const titleSize = Math.round(clamp(H * 0.055, 24, 52) * s);
  let y = H * 0.10;

  const titleY = y + titleSize * 0.5;
  y += titleSize + 26 * s;

  const tabW = Math.min(180 * s, (W - 90 * s - 36 * s) / 4);
  const tabH = 58 * s;
  const tabTotal = tabW * 4 + 12 * s * 3;
  const tabs = SHOP_CATS.map((c, i) => ({
    key: c.key, label: c.label,
    x: cx - tabTotal / 2 + i * (tabW + 12 * s), y, w: tabW, h: tabH
  }));
  y += tabH + 26 * s;

  const list = WEAPONS[shopCategory] || [];
  const cols = Math.min(3, Math.max(1, list.length));
  const gap = 14 * s;
  const cardW = Math.min(280 * s, (W - 90 * s - gap * (cols - 1)) / cols);
  const cardH = 182 * s;
  const rows = Math.ceil(list.length / cols);
  const startX = cx - (cardW * cols + gap * (cols - 1)) / 2;
  const cards = list.map((w, i) => ({
    id: w.id,
    x: startX + (i % cols) * (cardW + gap),
    y: y + Math.floor(i / cols) * (cardH + gap),
    w: cardW, h: cardH
  }));
  y += rows * (cardH + gap);

  const backW = Math.min(210 * s, W * 0.3);
  const back = { x: cx - backW / 2, y, w: backW, h: 54 * s };

  return { s, cx, titleY, titleSize, tabs, cards, back, msgY: back.y + back.h + 24 * s };
}

    }

    if (isEquipped) {

    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

//  LOOP
// ============================================================
let last = performance.now();

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  tNow += dt;

  update(dt);
  updateAmbience(dt);
  render();
  requestAnimationFrame(frame);
}

function drawMenuBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070a14');
  g.addColorStop(0.5, '#0b1020');
  g.addColorStop(1, '#04050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // dawn glow low on the horizon
  const dg = ctx.createRadialGradient(W * 0.5, H * 0.76, 0, W * 0.5, H * 0.76, Math.max(W, H) * 0.62);
  dg.addColorStop(0, 'rgba(255,120,60,0.16)');
  dg.addColorStop(0.45, 'rgba(160,60,90,0.07)');
  dg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W, H);

  // skyline silhouettes
  const base = H * 0.80;
  ctx.fillStyle = 'rgba(8,11,20,0.85)';
  for (const t of TOWERS) {
    const bw = (t.w / 220) * W;
    const x = (t.i / 220) * W;
    const bh = t.h * H * 2.2;
    ctx.fillRect(x, base - bh, bw + 1, bh + 2);
  }
  ctx.fillStyle = 'rgba(4,6,12,0.92)';
  const segW = W / SKYLINE.length;
  for (let i = 0; i < SKYLINE.length; i++) {
    const hh = SKYLINE[i] * H * 2.0;
    ctx.fillRect(i * segW, base - hh, segW + 1, hh + 2);
  }

  // drifting fog
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const y = H * (0.60 + i * 0.07);
    const off = ((tNow * (14 + i * 9)) % (W + 500)) - 250;
    const fg = ctx.createLinearGradient(off - 320, 0, off + 320, 0);
    fg.addColorStop(0, 'rgba(140,170,230,0)');
    fg.addColorStop(0.5, 'rgba(140,170,230,' + (0.055 - i * 0.014).toFixed(3) + ')');
    fg.addColorStop(1, 'rgba(140,170,230,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, y, W, 70);
  }
  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

const MAP_THUMB_CACHE = {};
function mapThumb(id) {
  if (MAP_THUMB_CACHE[id] !== undefined) return MAP_THUMB_CACHE[id];
  const mp = MAPS.find(m => m.id === id);
  if (!mp || typeof document.createElement !== 'function') { MAP_THUMB_CACHE[id] = null; return null; }
  try {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g2 = c.getContext('2d');
    const rows = mp.rows;
    const cols = rows[0].length;
    const cell = size / Math.max(cols, rows.length);
    const accent = (MAP_STYLE[id] && MAP_STYLE[id].wall) || '#8899aa';

    g2.fillStyle = '#070a12';
    g2.fillRect(0, 0, size, size);
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < cols; x++) {
        const ch = rows[y][x];
        if (ch === '#') { g2.fillStyle = accent; g2.globalAlpha = 0.8; }
        else if (ch === 'D') { g2.fillStyle = '#ffcf7a'; g2.globalAlpha = 0.95; }
        else { g2.fillStyle = '#9fc6ff'; g2.globalAlpha = 0.10; }
        g2.fillRect(x * cell, y * cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
    MAP_THUMB_CACHE[id] = c;
    return c;
  } catch (e) {
    MAP_THUMB_CACHE[id] = null;
    return null;
  }
}

      ctx.font = '700 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(120,130,150,0.5)' : 'rgba(255,150,115,0.9)';
      ctx.fillText('CHAPTER ' + ch.n, px, card.y + 20 * s);

      ctx.font = '800 ' + Math.round(15 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(150,160,180,0.45)' : '#f2f8ff';
      ctx.fillText(ch.name, px, card.y + 44 * s);

      ctx.font = '500 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(120,130,150,0.4)' : 'rgba(165,192,225,0.7)';
      wrapText(ch.brief, px, card.y + 64 * s, card.w - 40 * s, 13 * s);

      // status pill
      const pillY = card.y + card.h - 26 * s;
      const pillW = 84 * s, pillH = 20 * s;
      ctx.fillStyle = !unlocked ? 'rgba(60,64,76,0.5)'
        : card.index < progress ? 'rgba(61,255,176,0.16)' : 'rgba(255,143,99,0.18)';
      rr(px, pillY, pillW, pillH, pillH / 2);
      ctx.fill();
      ctx.textAlign = 'center';
      ctx.font = '800 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(160,170,190,0.55)'
        : card.index < progress ? '#8dffb0' : '#ffb08a';
      ctx.fillText(!unlocked ? 'LOCKED' : card.index < progress ? 'CLEARED' : 'READY',
        px + pillW / 2, pillY + pillH / 2);

      ctx.textAlign = 'right';
      ctx.font = '800 ' + Math.round(10 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = !unlocked ? 'rgba(150,160,180,0.4)' : 'rgba(140,255,180,0.9)';
      ctx.fillText('$' + ch.reward, card.x + card.w - 14 * s, pillY + pillH / 2);
    }
  } else {
    for (const card of lay.maps) {
      const mp = MAPS[card.index];
      const sel = card.index === menuMapIndex;

      ctx.fillStyle = sel ? 'rgba(30,34,50,0.97)' : 'rgba(14,18,30,0.92)';
      rr(card.x, card.y, card.w, card.h, 10 * s);
      ctx.fill();
      ctx.strokeStyle = sel ? mp.tint : 'rgba(110,160,255,0.22)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      if (sel) { ctx.shadowColor = mp.tint; ctx.shadowBlur = 18; }
      ctx.stroke();
      ctx.shadowBlur = 0;

      const pad2 = 9 * s;
      const thumb = card.h - pad2 * 2;
      const th = mapThumb(mp.id);
      if (th) {
        ctx.save();
        ctx.globalAlpha = sel ? 1 : 0.75;
        ctx.drawImage(th, card.x + pad2, card.y + pad2, thumb, thumb);
        ctx.restore();
        ctx.strokeStyle = 'rgba(120,160,220,0.25)';
        ctx.lineWidth = 1;
        ctx.strokeRect(card.x + pad2 + 0.5, card.y + pad2 + 0.5, thumb - 1, thumb - 1);
      }

      const tx = card.x + pad2 + thumb + 10 * s;
      ctx.textAlign = 'left';
      ctx.font = '800 ' + Math.round(10 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = sel ? mp.tint : '#e2eeff';
      ctx.fillText(mp.name, tx, card.y + 24 * s);

      ctx.font = '500 ' + Math.round(7.5 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(150,185,235,0.55)';
      wrapText(mp.desc, tx, card.y + 40 * s, card.w - (tx - card.x) - 10 * s, 11 * s);

      ctx.font = '700 ' + Math.round(7 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = sel ? 'rgba(255,220,180,0.8)' : 'rgba(140,170,215,0.4)';
      const indoorTag = !!(MAP_STYLE[mp.id] && MAP_STYLE[mp.id].indoor);
      ctx.fillText(indoorTag ? 'INDOOR' : 'OUTDOOR', tx, card.y + card.h - 16 * s);
    }
  }

  // ---- classes
  for (const chip of lay.classes) {
    const cl = CLASSES[chip.index];
    const sel = chip.index === chosenClass;
    ctx.fillStyle = sel ? 'rgba(30,34,50,0.96)' : 'rgba(14,18,30,0.9)';
    rr(chip.x, chip.y, chip.w, chip.h, 9 * s);
    ctx.fill();
    ctx.strokeStyle = sel ? cl.color : 'rgba(110,160,255,0.22)';
    ctx.lineWidth = sel ? 2 : 1.3;
    if (sel) { ctx.shadowColor = cl.color; ctx.shadowBlur = 12; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'left';
    ctx.fillStyle = cl.color;
    ctx.beginPath();
    ctx.arc(chip.x + 11 * s, chip.y + chip.h * 0.38, 3 * s, 0, TAU);
    ctx.fill();

    ctx.font = '800 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = sel ? '#f0f7ff' : 'rgba(210,228,255,0.78)';
    ctx.fillText(cl.name, chip.x + 20 * s, chip.y + chip.h * 0.40);

    ctx.font = '500 ' + Math.round(7 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.55)';
    ctx.fillText(cl.desc, chip.x + 20 * s, chip.y + chip.h * 0.72);
  }

  // ---- cash pill
  const cashText = '$' + cash;
  ctx.font = '900 ' + Math.round(12 * s * 1.45) + 'px ui-monospace, monospace';
  const cashW = ctx.measureText(cashText).width + 28 * s;
  const cashX = cx - cashW / 2;
  ctx.fillStyle = 'rgba(61,255,176,0.10)';
  rr(cashX, lay.cashY - 15 * s, cashW, 30 * s, 15 * s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(61,255,176,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = cashFlash > 0 ? '#b6ffd4' : '#8dffb0';
  ctx.fillText(cashText, cx, lay.cashY);

  // ---- buttons
  drawButton(lay.shop, 'ARMORY', false, '#ffb347');
  drawButton(lay.deploy, 'PLAY', true, '#ff8f63');

  // ---- hint
  const target = menuModeIndex === 0
    ? 'CHAPTER ' + (menuChapter + 1) + ' — ' + CHAPTERS[menuChapter].name
    : MODE_LABELS[menuModeIndex] + ' ON ' + MAPS[menuMapIndex].name;
  ctx.globalAlpha = 0.55 + Math.sin(tNow * 2.6) * 0.35;
  ctx.textAlign = 'center';
  ctx.font = '700 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#ffb08a';
  ctx.fillText('ENTER  —  ' + target, cx, lay.hintY);
  ctx.globalAlpha = 1;

  // ---- account badge
  ctx.textAlign = 'left';
  ctx.font = '700 ' + Math.round(7.5 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(140,180,240,0.45)';
  ctx.fillText('OPERATIVE', 20 * s, 16 * s);
  ctx.font = '800 ' + Math.round(9 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = '#dff2ff';
  ctx.fillText(currentUser || 'GUEST', 20 * s, 32 * s);

  drawButton(lay.switchBtn, 'SWITCH', false, '#5fc9ff');

  ctx.restore();
}

// ------------------------------------------------------------
//  MAP VOTE — the lobby picks the arena
// ------------------------------------------------------------
function layoutVote() {
  const s = uiScale();
  const cx = W / 2;
  const titleSize = Math.round(clamp(H * 0.06, 22, 54) * s);
  let y = H * 0.12;
  const titleY = y + titleSize * 0.5;
  y += titleSize + 14 * s;
  const subY = y + 6 * s;
  y += 18 * s + 26 * s;

  const cols = 2;
  const gap = 18 * s;
  const cardW = Math.min(400 * s, (W - 120 * s - gap) / 2);
  const cardH = Math.min(190 * s, H * 0.26);
  const totalW = cardW * 2 + gap;
  const startX = cx - totalW / 2;
  const cards = voteOptions.map((mi, i) => ({
    index: i,
    mapIndex: mi,
    x: startX + (i % cols) * (cardW + gap),
    y: y + Math.floor(i / cols) * (cardH + gap),
    w: cardW,
    h: cardH
  }));
  const rows = Math.ceil(voteOptions.length / cols);
  y += rows * (cardH + gap) + 16 * s;

  return { s, cx, titleY, titleSize, subY, cards, timerY: y };
}

function drawVote() {
  ctx.save();
  drawMenuBackdrop();

  const lay = layoutVote();
  const s = lay.s;
  const cx = lay.cx;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + lay.titleSize + 'px ui-monospace, monospace';
  ctx.fillStyle = '#f3e9ff';
  ctx.shadowColor = '#8f5cff';
  ctx.shadowBlur = 30;
  ctx.fillText('MAP VOTE', cx, lay.titleY);
  ctx.shadowBlur = 0;

  ctx.font = '600 ' + Math.round(10 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(180,200,240,0.72)';
  ctx.fillText('THE SURVIVORS PICK THE NEXT ARENA  ·  CLICK OR PRESS 1-4', cx, lay.subY);

  const totalVotes = voteCounts.reduce((a, b) => a + b, 0) || 1;

  for (const card of lay.cards) {
    const mp = MAPS[card.mapIndex];
    const mine = voteMine === card.index;
    const count = voteCounts[card.index] || 0;
    const lead = count === Math.max.apply(null, voteCounts) && count > 0;

    ctx.fillStyle = mine ? 'rgba(36,30,54,0.97)' : 'rgba(14,18,30,0.94)';
    rr(card.x, card.y, card.w, card.h, 10 * s);
    ctx.fill();
    ctx.strokeStyle = mine ? 'rgba(180,140,255,0.95)' : lead ? 'rgba(255,190,120,0.6)' : 'rgba(110,160,255,0.22)';
    ctx.lineWidth = mine ? 2.8 : 1.5;
    if (mine) { ctx.shadowColor = '#8f5cff'; ctx.shadowBlur = 18; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    const pad = 12 * s;
    const th = card.h - pad * 2;
    const thumb = mapThumb(mp.id);
    if (thumb) {
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.drawImage(thumb, card.x + pad, card.y + pad, th, th);
      ctx.restore();
      ctx.strokeStyle = 'rgba(120,160,220,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(card.x + pad + 0.5, card.y + pad + 0.5, th - 1, th - 1);
    }

    const tx = card.x + pad + th + 14 * s;
    const tw = card.x + card.w - pad - tx;

    ctx.textAlign = 'left';
    ctx.font = '800 ' + Math.round(11 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = mine ? '#e9dcff' : '#e2eeff';
    ctx.fillText(mp.name, tx, card.y + 26 * s);

    ctx.font = '600 ' + Math.round(7.5 * s * 1.45) + 'px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,185,235,0.55)';
    const tag = (MAP_STYLE[mp.id] && MAP_STYLE[mp.id].indoor) ? 'INDOOR' : 'OUTDOOR';
    ctx.fillText(tag + '  ·  ' + count + (count === 1 ? ' VOTE' : ' VOTES'), tx, card.y + 46 * s);

    // vote bar
    const barY = card.y + card.h - 34 * s;
    const barW = tw;
    ctx.fillStyle = 'rgba(8,12,22,0.8)';
    rr(tx, barY, barW, 10 * s, 5 * s);
    ctx.fill();
    ctx.fillStyle = mine ? 'rgba(170,130,255,0.9)' : 'rgba(120,180,255,0.75)';
    const frac = count / Math.max(1, totalVotes);
    if (frac > 0) {
      rr(tx, barY, Math.max(6 * s, barW * frac), 10 * s, 5 * s);
      ctx.fill();
    }

    if (mine) {
      ctx.font = '800 ' + Math.round(7 * s * 1.45) + 'px ui-monospace, monospace';
      ctx.fillStyle = '#c9a8ff';
      ctx.fillText('YOUR VOTE', tx, barY + 22 * s);
    }
  }

  // countdown
  const secs = Math.max(0, Math.ceil(voteTimer));
  ctx.textAlign = 'center';
  ctx.font = '900 ' + Math.round(22 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = secs <= 3 ? '#ff8f63' : 'rgba(200,215,245,0.85)';
  ctx.fillText(String(secs), cx, lay.timerY + 10 * s);
  ctx.font = '600 ' + Math.round(8 * s * 1.45) + 'px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(150,180,225,0.5)';
  ctx.fillText('SECONDS', cx, lay.timerY + 30 * s);

  ctx.restore();
}

// ============================================================
//  BOOT
// ============================================================
loadAccounts();
parseMap();
spawnPoints = computeSpawns();
resize();
requestAnimationFrame(frame);

// test/debug hook
window.__fps = {
  get state() { return state; },
  get mode() { return mode; },
  get hp() { return PLAYER.hp; },
  get maxHp() { return PLAYER.maxHp; },
  get classIndex() { return chosenClass; },
  get classList() { return CLASSES.map(c => c.name); },
  setClass(i) { chosenClass = clamp(i, 0, CLASSES.length - 1); saveProfile(); },
  get score() { return { you: score.you, them: score.them }; },
  get bots() { return bots.length; },
  get aliveBots() { return bots.filter(b => b.alive).length; },
  get wave() { return wave; },
  get player() { return { x: PLAYER.x, y: PLAYER.y, ang: PLAYER.ang, pitch: PLAYER.pitch, z: PLAYER.z, camZ: PLAYER.camZ, slot: PLAYER.slot }; },
  get ads() { return PLAYER.ads; },
  get sens() { return PLAYER.sens; },
  get fov() { return FOV_ACTIVE; },
  get loadout() { return SLOTS.map(s => PLAYER.loadout[s] && PLAYER.loadout[s].name); },
  get ammo() { return PLAYER.ammo[PLAYER.slot]; },
  get botList() { return bots.map(b => ({ x: b.x, y: b.y, hp: b.hp, alive: b.alive, name: b.name, deathT: b.deathT, hitKick: b.hitKick })); },
  get drawT() { return PLAYER.drawT; },
  get sway() { return { x: PLAYER.swayX, y: PLAYER.swayY }; },
  get user() { return currentUser; },
  get ui() {
    if (state === 'menu') {
      const l = layoutMenu();
      return { modes: l.modes, chapters: l.chapters, maps: l.maps, classes: l.classes, shop: l.shop, deploy: l.deploy, switchBtn: l.switchBtn };
    }
    if (state === 'shop') {
      const l = layoutShop();
      return { tabs: l.tabs, cards: l.cards, back: l.back };
    }
    if (state === 'vote') {
      const l = layoutVote();
      return { cards: l.cards };
    }
    if (state === 'login') {
      const l = layoutLogin();
      return { cards: l.cards, nameField: l.nameField, passField: l.passField };
    }
    return null;
  },
  get accountList() { return accountNames(); },
  get mapNames() { return MAPS.map(m => m.name); },
  get mapIds() { return MAPS.map(m => m.id); },
  get doors() { return doorList.map(d => ({ x: d.x, y: d.y, open: d.open, target: d.target })); },
  toggleDoorAt(i) { const d = doorList[i]; if (d) { d.target = d.target > 0.5 ? 0 : 1; sound.door(); } },
  probeSolid(cx, cy) { return solidAt(cx, cy); },
  get wallHeight() { return mapStyle().height || 1; },
  get weaponCount() { return SLOTS.reduce((n, s) => n + WEAPONS[s].length, 0); },
  get zombieTypes() { return Object.keys(ZOMBIE_TYPES); },
  login(name, pass) { return loginAs(name, pass); },
  logout() { logoutToLogin(); },
  typeName(text) { nameInput = String(text).slice(0, 14).toUpperCase(); },
  typePass(text) { passInput = String(text).slice(0, 24); },
  get loginError() { return loginError; },
  get cash() { return cash; },
  get map() { return MAPS[selectedMap] ? MAPS[selectedMap].id : '?'; },
  get equipped() { return Object.assign({}, equipped); },
  get owned() { return Object.assign({}, owned); },
  giveCash(n) { cash += n; saveProfile(); },
  buy(id) { return buyWeapon(id); },
  equip(id) { return equipWeapon(id); },
  openShop() { state = 'shop'; },
  closeShop() { state = 'menu'; },
  setMap(i) { selectedMap = clamp(i, 0, MAPS.length - 1); saveProfile(); },
  start: startChapter,
  startFree: startFreePlay,
  get vote() {
    return { options: voteOptions.slice(), counts: voteCounts.slice(), mine: voteMine, timer: voteTimer, state: state };
  },
  castVote(i) { castVote(i); },
  finishVote() { voteTimer = 0.05; },
  get session() { return sessionMode; },
  get menuMode() { return menuModeIndex; },
  get menuMap() { return menuMapIndex; },
  get shopCategory() { return shopCategory; },
  get shopCardIds() { return (WEAPONS[shopCategory] || []).map(w => w.id); },
  setShopCategory(k) { shopCategory = k; },
  get chapter() { return chapterIndex; },
  get phase() { return phase; },
  get phaseKills() { return phaseKills; },
  get phaseQuota() { return phaseQuota; },
  get chapterInfo() { const c = chapter(); return { n: c.n, name: c.name, quota: c.quota }; },
  get progress() { return progress; },
  get indoor() { return indoorMode; },
  get objective() { return phase; },
  get hatch() { return hatch ? { x: hatch.x, y: hatch.y } : null; },
  get specials() { return mapSpecials; },
  aim(ang) { PLAYER.ang = ang; },
  teleport(x, y) { PLAYER.x = x; PLAYER.y = y; },
  killBotAt(i) { const b = bots[i]; if (b && b.alive) damageBot(b, 9999); },
  putBotAt(i, x, y) { const b = bots[i]; if (b) { b.x = x; b.y = y; b.alive = true; } },
  hurtBot(i, n) { const b = bots[i]; if (b && b.alive) damageBot(b, n); },
  spawnType(t) {
    const T = ZOMBIE_TYPES[t];
    if (!T) return -1;
    const b = makeBot(bots.length);
    b.type = t;
    b.name = T.name;
    b.support = T.support || null;
    b.armor = T.armor === undefined ? 1 : T.armor;
    b.ranged = !!T.ranged;
    b.hp = T.hp;
    b.maxHp = T.hp;
    b.x = PLAYER.x + 2.5;
    b.y = PLAYER.y + 2.5;
    b.supportT = 0.2;
    bots.push(b);
    return bots.length - 1;
  },
  killAny() {
    for (const b of bots) if (b.alive) { damageBot(b, 9999); return true; }
    return false;
  },
  heal() { PLAYER.hp = PLAYER.maxHp; },
  hurt(n) { damagePlayer(n, 0, 0); },
  setSlot(s) { switchSlot(s); },
  press(code) { onKeyDown({ code, preventDefault() {}, repeat: false }); },
  down(code) { onKeyDown({ code, preventDefault() {}, repeat: false }); },
  release(code) { onKeyUp({ code, preventDefault() {} }); },
  fire(on) { const was = firing; firing = !!on; if (!was && on) fireBuffer = 0.22; },
  tick(n) { for (let i = 0; i < n; i++) update(1 / 60); }
};

})();
</script>
